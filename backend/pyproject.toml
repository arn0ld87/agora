[project]
name = "agora-backend"
version = "0.9.5"
description = "Agora - Hybrid Multi-Agent Resonance Simulator on Neo4j + Ollama"
requires-python = ">=3.14,<3.15"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Alexander Schneider", email = "schneider@alexle135.de" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # LLM client (OpenAI-compatible, used for Ollama as well)
    "openai>=1.0.0",

    # Neo4j graph database driver
    "neo4j>=5.15.0",

    # OASIS social-media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # Der Produktionspfad unter `app/` importiert torch nicht — es kommt dort
    # transitiv ueber camel-oasis -> sentence-transformers. Ausserhalb von
    # `app/` wird es sehr wohl importiert: `tests/conftest.py` laedt es
    # bewusst frueh, und `scripts/_sim_common.py` lazy. Beide Pfade laufen
    # mit dem CPU-Build unveraendert.
    #
    # Der Eintrag steht hier, weil `[tool.uv.sources]` ausschliesslich auf
    # direkt deklarierte Dependencies wirkt: ohne ihn laesst sich die
    # Bezugsquelle einer transitiven Abhaengigkeit nicht umlenken. Die
    # Begruendung fuer die Umlenkung steht bei `[[tool.uv.index]]` unten.
    # Die untere Schranke haelt den bereits aufgeloesten Stand und
    # verhindert einen stillen Downgrade; nach oben ist bewusst offen.
    "torch>=2.13.0",

    # File parsing
    "PyMuPDF>=1.24.0",
    # Image handling for PDF vision pipeline (downscale, format conversion)
    "Pillow>=10.0.0",
    # HTTP client for web tools (Tavily)
    "requests>=2.28.0",
    # Encoding detection for non-UTF-8 text files
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.5.0",

    # Event bus transport (Issue #9 Phase B). Used when EVENT_BUS_BACKEND=redis;
    # the FilePolling fallback keeps the offline-only path working without Redis.
    "redis>=5.0.0",

    # Graph analytics (Issue #12): Louvain community detection + betweenness
    # centrality on the agent-interaction graph. networkx >= 3.2 ships the
    # built-in community.louvain_communities implementation.
    "networkx>=3.2",

    # Production WSGI: gunicorn + gevent worker (non-blocking SSE)
    "gunicorn>=23.0",
    "gevent>=24.0",

    # Observability: OpenTelemetry Tracing (Slice 1b, 2026-05-15)
    # Default-Off: OTEL_ENABLED=false => kein Overhead. Deps werden aber
    # immer installiert, damit das Import-Gate funktioniert.
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-flask>=0.45b0",
    "opentelemetry-instrumentation-requests>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    # Observability: Logs-Korrelation (Slice 3a, 2026-05-15)
    # Patcht den Root-Logger um OTel-Trace-IDs in LogRecords zu injizieren.
    "opentelemetry-instrumentation-logging>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pipreqs>=0.5.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "types-requests>=2.32.0",
    "jsonschema>=4.0.0",
    "fakeredis[lua]>=2.30.0",
    "radon>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "pyright>=1.1.350",
    "types-requests>=2.32.0",
    "jsonschema>=4.0.0",
    "fakeredis[lua]>=2.30.0",
    "radon>=6.0.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
# Coverage-Flags bewusst NICHT in `addopts`: Subset-Test-Aufrufe wie
# `pytest tests/contracts/` (siehe `.github/workflows/contract-gates.yml`)
# wuerden sonst durch `--cov-fail-under=53` brechen, weil ein Subset
# nie die Total-Coverage erreicht. Stattdessen aktiviert
# `.github/workflows/ci.yml::backend`-Job die Coverage-Flags explizit.
# Lokal manuell: `uv run pytest --cov=app --cov-report=term-missing`.
addopts = "-ra --tb=short --import-mode=importlib -m 'not llm'"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
markers = [
    "eval: baseline/eval suite (fixture-driven)",
    "llm: Echter LLM-Aufruf (Ollama-Instanz erforderlich). Ausführen mit: pytest -m llm",
    "perf: Performance-Budget-Tests (Stufe 1 deterministisch via Mock; Stufe 2 mit -m 'perf and llm' gegen echtes Ollama).",
]
# Issue #1090 (E8 aus #979): belegte Upstream-Warnquellen gezielt filtern.
# Jeder Filter ist auf Nachricht UND Modul eingegrenzt — nie auf eine ganze
# Kategorie. Projekteigene DeprecationWarnings bleiben dadurch sichtbar und
# gate-faehig (Beleg: tests/test_warning_filters.py). Messung an
# tests/contracts/ am 2026-08-08: 30513 Warnungen vorher, danach nur noch
# die nicht gefilterten Restwarnungen.
filterwarnings = [
    # pytest-asyncio 1.x ruft asyncio.iscoroutinefunction auf (deprecated seit
    # Python 3.14, Entfernung 3.16). 30486 der 30513 Warnungen des
    # contracts-Laufs; gefixt upstream erst mit Drop von Python<3.10-Support.
    # Quelle: .venv/…/pytest_asyncio/plugin.py:166 und :429.
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio\\.plugin",
    # pytest-asyncio nutzt ausserdem asyncio.get_event_loop_policy (ebenfalls
    # deprecated seit 3.14, Entfernung 3.16).
    # Quelle: .venv/…/pytest_asyncio/plugin.py:996.
    "ignore:'asyncio\\.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio\\.plugin",
    # neo4j._meta nutzt dieselbe deprecated asyncio-API fuer seine
    # Sync/Async-Erkennung. Quelle: .venv/…/neo4j/_meta.py:189.
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning:neo4j\\._meta",
    # opentelemetry-instrumentation-flask liest flask.__version__ (deprecated,
    # Entfernung Flask 3.2). Quelle: .venv/…/opentelemetry/instrumentation/
    # flask/__init__.py beim App-Import.
    "ignore:The '__version__' attribute is deprecated:DeprecationWarning:opentelemetry\\.instrumentation\\.flask",
]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".venv",
    "uploads",
    "log",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "I", "UP", "SIM"]
ignore = [
    "E501",
    # Phase-2 Baseline: bestehende Altlasten bleiben bis zu den fokussierten
    # Refactor-Phasen unverändert; neue Regel-Familien sind trotzdem sichtbar.
    "B007",
    "B008",
    "B011",
    "B023",
    "B904",
    "B905",
    "I001",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM118",
    "SIM300",
    "UP006",
    "UP007",
    "UP015",
    "UP017",
    "UP035",
    "UP037",
    "UP041",
    "UP042",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"scripts/run_parallel_simulation.py" = ["E402", "F401"]
"scripts/run_reddit_simulation.py" = ["F401"]
"scripts/run_twitter_simulation.py" = ["F401"]
"scripts/security_verify.py" = ["E402"]
# BLE001 kam mit #626 in select; app/ wurde dabei bereinigt (~120 Stellen).
# Standalone-CLI-Runner (scripts/) und Tests fangen bewusst breit ab —
# Aufräumen läuft unter Milestone M5 (#638), bis dahin Baseline-Ignore,
# damit der Heavy-Job (`ruff check .`) auf main nicht rot bleibt.
"scripts/*" = ["BLE001"]
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "app.contracts.*",
]
# Bewusst nicht `strict = true`. Strict schaltet ~10 Flags zu, von denen bei
# Pydantic-Modellen nur eines trägt: dass Funktionen annotiert sind. Der Rest
# (disallow_untyped_calls, warn_return_any, disallow_any_generics,
# no_implicit_reexport) produzierte fast nur Reibung an Pydantic-Dekoratoren
# und Fremdcode-Aufrufen — Zeit, die kein Contract-Bug rechtfertigt.
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "app.api.*",
]
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "app",
    "app.config",
    "app.container",
    "app.models.*",
    "app.services.*",
    "app.storage.*",
    "app.utils.*",
    # app.llm.* — mechanischer Split aus app/utils/llm_client.py (#582),
    # erbt dessen ignore_errors-Status. Typing-Cleanup folgt mit der
    # Provider-Abstraktion (#590).
    "app.llm.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.contracts.dump_schemas"
disable_error_code = ["attr-defined"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Unblock Python 3.14 (Issue #199): Multiple dependencies are pinned to old versions
# without cp314 wheels, and their source builds fail on Python 3.14.
# Overriding them to newer versions that provide native cp314 wheels.
override-dependencies = [
    "tiktoken>=0.12.0",
    "pillow>=12.3.0",
    "pandas>=3.0.3",
    "numpy>=2.4.4",
    # GHSA-Override: unstructured < 0.18.18 hat Path Traversal via MSG-
    # Attachment (critical, Arbitrary File Write) plus < 0.14.3 XXE.
    # camel-oasis 0.2.5 pinned 0.13.7 — Override zieht 0.18.18 trotzdem hoch.
    # CVE-2026-71428 (critical) trifft unstructured < 0.24.0. Der Sprung von
    # 0.18.32 ist bewusst kein Patch-Bump: 0.24.0 ist die erste Version mit
    # dem Fix, ein kleinerer Schritt existiert nicht (#1410).
    "unstructured>=0.24.0",
    # Folgekonflikt aus dem unstructured-Bump: unstructured 0.24.0 verlangt
    # psutil>=7.2.2, waehrend camel-ai psutil<6 pinnt — auch in der aktuellsten
    # Version 0.2.90, es gibt also keine camel-ai, die beides erfuellt. Ohne
    # diesen Override ist die Resolution unloesbar und CVE-2026-71428 bliebe
    # offen. psutil wird von camel-ai nur fuer Prozess- und Speicherauskuenfte
    # benutzt; der 5.x->7.x-Sprung ist damit das kleinere Risiko gegenueber
    # einer offenen critical-CVE (#1410).
    "psutil>=7.2.2",
    # CVE-2025-71176: pytest 8.2.0 (pinned by camel-oasis 0.2.5) has a
    # vulnerability. Upgrading to >=9.0.3.
    "pytest>=9.0.3",
    # sentence-transformers 3.0.0 (camel-oasis-Pin) hat drei
    # SyntaxWarning("invalid escape sequence") in eigenen Modulen
    # (SentenceEvaluator.py, model_card.py, DenoisingAutoEncoderLoss.py).
    # Upgrade auf 5.x unblocks transformers v5 compatibility to resolve
    # CVE-2026-4372, CVE-2026-1839 und PYSEC-2025-217.
    "sentence-transformers>=5.3.0",
    "transformers>=5.3.0",
    # GHSA-p4gq-832x-fm9v / CVE-2026-54293 / PYSEC-2026-2078 (Path Traversal
    # in nltk.data.load()): fixed upstream in nltk 3.10.0. Bump auf 3.10.1
    # (aktuell, 2026-08-01) loest diese Advisory auf (#995).
    # PYSEC-2026-597 / CVE-2026-12243 bleibt unberuehrt: laut OSV existiert
    # dafuer kein offizielles "fixed"-Event, aber last_affected: 3.9.4 — ab
    # 3.10.0 faellt das Paket aus dem affected-Set, pip-audit meldet die
    # Advisory dann nicht mehr, ohne dass ein echter Fix vorliegt (#661).
    # CVE-2026-79675 (critical), CVE-2026-78680 und CVE-2026-71513 treffen
    # nltk <= 3.10.1; gefixt in 3.10.3 (#1410). Der Override laeuft seit dem
    # unstructured-Bump auf 0.27.5 aber ins Leere: unstructured zieht kein nltk
    # mehr (es nutzt jetzt spacy), nltk ist damit aus uv.lock verschwunden und
    # Agora importiert es an keiner Stelle selbst. Die Zeile bleibt als Riegel
    # stehen, falls eine kuenftige Transitive nltk zurueckholt — sie darf dann
    # nicht unterhalb von 3.10.3 landen.
    "nltk==3.10.3",
]

# ---------------------------------------------------------------------------
# torch aus dem CPU-Index statt von PyPI.
#
# torch ist keine bewusste Abhaengigkeit von Agora. In den Produktionspfad
# unter `app/` kommt es ausschliesslich transitiv:
#   camel-oasis -> sentence-transformers -> torch
# Der einzige Treffer fuer sentence_transformers dort ist ein
# warnings.filterwarnings in __init__.py. Direkt importiert wird torch nur
# ausserhalb von `app/`: in `tests/conftest.py` und lazy in
# `scripts/_sim_common.py` — beide funktionieren mit dem CPU-Build
# unveraendert, was im gebauten Image geprueft ist.
#
# Das PyPI-Wheel deklariert seine CUDA-Abhaengigkeiten mit dem Marker
# `sys_platform == 'linux'` ohne Architektur-Einschraenkung. Im Container
# installiert uv sie deshalb mit, unabhaengig davon, ob eine GPU existiert
# oder je existieren wird. Gemessen in der laufenden venv auf armserver:
# nvidia/ 2,9 GB, torch/ 859 MB, triton/ 650 MB — 4,4 GB von 5,3 GB.
#
# Der CPU-Index liefert dasselbe torch ohne diese Abhaengigkeiten. Agora
# betreibt seine Modelle ohnehin ueber Ollama und OpenAI-kompatible
# Endpunkte, nicht in-process auf einer GPU; die Aufloesung von
# ADR-0007 (Embeddings ueber den EmbeddingConfigurationStore) bleibt
# unberuehrt.
#
# Die Quelle gilt nur fuer Linux. Auf macOS gibt es im CPU-Index keine
# Wheels — dort liefert PyPI ohnehin eine CPU-Variante, weil die
# CUDA-Marker nicht greifen.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
