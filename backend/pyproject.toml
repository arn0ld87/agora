[project]
name = "agora-backend"
version = "1.0.0"
description = "Agora - Hybrid Multi-Agent Resonance Simulator on Neo4j + Ollama"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Alexander Schneider", email = "schneider@alexle135.de" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # LLM client (OpenAI-compatible, used for Ollama as well)
    "openai>=1.0.0",

    # Neo4j graph database driver
    "neo4j>=5.15.0",

    # OASIS social-media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.90",

    # File parsing
    "PyMuPDF>=1.24.0",
    # Image handling for PDF vision pipeline (downscale, format conversion)
    "Pillow>=10.0.0",
    # HTTP client for web tools (Tavily)
    "requests>=2.28.0",
    # Encoding detection for non-UTF-8 text files
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Event bus transport (Issue #9 Phase B). Used when EVENT_BUS_BACKEND=redis;
    # the FilePolling fallback keeps the offline-only path working without Redis.
    "redis>=5.0.0",

    # Graph analytics (Issue #12): Louvain community detection + betweenness
    # centrality on the agent-interaction graph. networkx >= 3.2 ships the
    # built-in community.louvain_communities implementation.
    "networkx>=3.2",

    # Production WSGI: gunicorn + gevent worker (non-blocking SSE)
    "gunicorn>=23.0",
    "gevent>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pipreqs>=0.5.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "types-requests>=2.32.0",
    "jsonschema>=4.0.0",
    "fakeredis[lua]>=2.30.0",
    "radon>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "types-requests>=2.32.0",
    "jsonschema>=4.0.0",
    "fakeredis[lua]>=2.30.0",
    "radon>=6.0.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
# Coverage-Flags bewusst NICHT in `addopts`: Subset-Test-Aufrufe wie
# `pytest tests/contracts/` (siehe `.github/workflows/contract-gates.yml`)
# wuerden sonst durch `--cov-fail-under=53` brechen, weil ein Subset
# nie die Total-Coverage erreicht. Stattdessen aktiviert
# `.github/workflows/ci.yml::backend`-Job die Coverage-Flags explizit.
# Lokal manuell: `uv run pytest --cov=app --cov-report=term-missing`.
addopts = "-ra --tb=short --import-mode=importlib -m 'not llm'"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
markers = [
    "eval: baseline/eval suite (fixture-driven)",
    "llm: Echter LLM-Aufruf (Ollama-Instanz erforderlich). Ausführen mit: pytest -m llm",
    "perf: Performance-Budget-Tests (Stufe 1 deterministisch via Mock; Stufe 2 mit -m 'perf and llm' gegen echtes Ollama).",
]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "uploads",
    "log",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = [
    "E501",
    # Phase-2 Baseline: bestehende Altlasten bleiben bis zu den fokussierten
    # Refactor-Phasen unverändert; neue Regel-Familien sind trotzdem sichtbar.
    "B007",
    "B008",
    "B011",
    "B023",
    "B904",
    "B905",
    "I001",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM118",
    "SIM300",
    "UP006",
    "UP007",
    "UP015",
    "UP017",
    "UP035",
    "UP037",
    "UP041",
    "UP042",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"scripts/run_parallel_simulation.py" = ["E402", "F401"]
"scripts/run_reddit_simulation.py" = ["F401"]
"scripts/run_twitter_simulation.py" = ["F401"]
"scripts/security_verify.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "app.contracts.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "app.api.*",
]
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "app",
    "app.config",
    "app.container",
    "app.models.*",
    "app.services.*",
    "app.storage.*",
    "app.utils.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.contracts.dump_schemas"
disable_error_code = ["attr-defined"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
