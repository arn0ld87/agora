; Messkonfiguration fuer das Typ-Schuld-Gate (scripts/check_mypy_debt.py).
;
; Spiegelt [tool.mypy] aus pyproject.toml — MIT EINER AUSNAHME: der
; ``ignore_errors = true``-Block fuer app, app.config, app.container,
; app.models.*, app.services.*, app.storage.*, app.utils.* und app.llm.* fehlt
; hier bewusst. Genau dieser Block macht die grossen Bereiche des Backends im
; regulaeren Gate unsichtbar; diese Datei misst, was dort tatsaechlich liegt.
;
; Die *relaxierenden* Overrides (app.api.*, app.contracts.*) bleiben erhalten,
; damit die Messung die Realitaet eines abgeschalteten ignore_errors abbildet
; und nicht eine haertere Welt, die niemand anstrebt.
;
;
; Bewusst NICHT mitgemessen: die Koerper untypisierter Funktionen. mypy prueft
; sie per Default nicht (check_untyped_defs), und [tool.mypy] aendert das nicht —
; diese Datei soll exakt "ignore_errors aus, sonst alles wie konfiguriert"
; abbilden, nicht eine strengere Welt. Zur Einordnung: mit
; --check-untyped-defs waren es am 2026-09-11 auf demselben Stand 282 statt 266
; Fehler. Diese 16 sind damit ebenfalls benannt statt verschwiegen, aber nicht
; Teil der gegateten Baseline.
;
; Diese Datei ersetzt das regulaere `mypy app` NICHT — sie ergaenzt es.

[mypy]
python_version = 3.14
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
warn_unused_configs = False

[mypy-app.contracts.*]
disallow_untyped_defs = True

[mypy-app.api.*]
check_untyped_defs = False
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
disallow_untyped_defs = False
warn_return_any = False

[mypy-app.contracts.dump_schemas]
disable_error_code = attr-defined
