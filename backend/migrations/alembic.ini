# Alembic-Konfiguration für Agora (docs/plans/supabase.md §8).
#
# Ab hier gilt: das Datenbankschema wird ausschliesslich ueber versionierte
# Migrationen geaendert. Kein `CREATE TABLE IF NOT EXISTS` in fachlichen
# Stores.
#
# Aufruf aus `backend/`:
#   uv run alembic -c migrations/alembic.ini upgrade head
#   uv run alembic -c migrations/alembic.ini revision -m "beschreibung"
#   uv run alembic -c migrations/alembic.ini current
#
# Diese Datei traegt bewusst KEIN `sqlalchemy.url`. Die Verbindung kommt aus
# `DATABASE_URL` in der Umgebung (siehe `env.py`) — eine Zeichenkette mit
# Passwort gehoert nicht in eine versionierte Datei.

[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
prepend_sys_path = %(here)s/..
path_separator = os

# Zeitstempel im Dateinamen: die lexikalische Reihenfolge im Verzeichnis
# entspricht dann der zeitlichen, was das Lesen eines `versions/`-Listings
# ohne `alembic history` erst brauchbar macht.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
# Bewusst leer: die Formatierung der generierten Datei uebernimmt derselbe
# ruff-Lauf wie fuer den Rest des Backends.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
