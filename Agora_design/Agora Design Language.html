<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agora — Design Language</title>
<link rel="stylesheet" href="agora-tokens.css">
<style>
  /* Page-specific glue */
  body { background: var(--mono-950); }
  /* Faint grid for the canvas base */
  .dc-canvas-bg {
    background:
      radial-gradient(circle at 12% 8%, rgba(255,106,0,0.05), transparent 40rem),
      radial-gradient(circle at 88% 90%, rgba(93,180,200,0.04), transparent 36rem),
      var(--mono-950);
  }

  /* Artboard inner shell */
  .ab {
    width: 100%; height: 100%;
    background: var(--mono-950);
    color: var(--fg);
    font-family: var(--ff-sans);
    overflow: hidden;
    position: relative;
  }
  .ab--grid::before {
    content: ""; position: absolute; inset: 0;
    background: var(--bg-grid);
    pointer-events: none; opacity: 0.6;
  }
  .ab-pad { padding: 40px 48px; }
  .ab-pad-lg { padding: 56px 64px; }

  /* Section header pattern (used inside artboards) */
  .ab-head { display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-5); align-items: baseline; padding-bottom: 18px; border-bottom: 1px solid var(--rule-strong); margin-bottom: var(--s-6); }
  .ab-head .num { font-family: var(--ff-serif); font-weight: 300; font-size: 64px; line-height: 0.9; letter-spacing: -0.04em; color: var(--fg); }
  .ab-head .meta-stack { display: flex; flex-direction: column; gap: 6px; }
  .ab-head .title { font-family: var(--ff-serif); font-weight: 400; font-size: var(--fs-32); line-height: 1.1; letter-spacing: -0.015em; }
  .ab-head .coord-row { font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); text-transform: uppercase; color: var(--fg-meta); }

  /* Agora glyph — the signature */
  .glyph-mark { display: inline-block; }

  /* Color swatch grid */
  .swatch-row { display: flex; flex-direction: column; gap: 4px; }
  .swatch { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: var(--s-4); padding: 10px 0; border-top: 1px solid var(--rule); }
  .swatch:first-child { border-top: 0; }
  .swatch .chip { width: 56px; height: 28px; border-radius: var(--r-1); border: 1px solid var(--rule); }
  .swatch .name { font-family: var(--ff-sans); font-size: var(--fs-13); color: var(--fg); }
  .swatch .name .role { display: block; font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); text-transform: uppercase; color: var(--fg-meta); margin-top: 2px;}
  .swatch .hex { font-family: var(--ff-mono); font-size: var(--fs-12); color: var(--fg-meta); letter-spacing: var(--ls-mono-tight); }

  /* Type specimen rows */
  .type-row { display: grid; grid-template-columns: 180px 1fr; gap: var(--s-6); padding: var(--s-5) 0; border-top: 1px solid var(--rule); align-items: baseline; }
  .type-row:first-child { border-top: 0; }
  .type-row .label { font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono); text-transform: uppercase; color: var(--fg-meta); padding-top: 6px; }
  .type-row .label small { display: block; color: var(--mono-700); margin-top: 4px; }

  /* Component grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-7); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-6); }
  .group { display: flex; flex-direction: column; gap: var(--s-3); }
  .group .group-label { font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono); text-transform: uppercase; color: var(--fg-meta); padding-bottom: 8px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }

  /* Workspace shell */
  .ws { display: grid; grid-template-columns: 240px 1fr; height: 100%; }
  .ws-side { background: var(--bg-elevated); border-right: 1px solid var(--rule); display: flex; flex-direction: column; }
  .ws-side .brand { padding: 18px 20px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
  .ws-side .nav-section { padding: var(--s-4) 0; border-bottom: 1px solid var(--rule); }
  .ws-side .nav-section-label { padding: 6px 20px; font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono); text-transform: uppercase; color: var(--fg-meta); }
  .ws-side .nav-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 20px; font-size: var(--fs-13); color: var(--fg-body); cursor: pointer; border-left: 2px solid transparent; }
  .ws-side .nav-link:hover { color: var(--fg); background: var(--bg-panel); }
  .ws-side .nav-link.is-active { color: var(--fg); border-left-color: var(--accent); background: var(--bg-panel-2); }
  .ws-side .nav-link .idx { font-family: var(--ff-mono); font-size: var(--fs-11); color: var(--fg-meta); letter-spacing: var(--ls-mono-tight); }
  .ws-side .nav-link.is-active .idx { color: var(--accent); }
  .ws-side .nav-link .end { font-family: var(--ff-mono); font-size: var(--fs-11); color: var(--fg-meta); }
  .ws-side .ws-foot { margin-top: auto; padding: var(--s-4) 20px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); text-transform: uppercase; color: var(--fg-meta); }

  .ws-main { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  .ws-topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--bg-elevated); gap: var(--s-5); }
  .ws-topbar .crumbs { display: flex; align-items: center; gap: 10px; font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); text-transform: uppercase; color: var(--fg-meta); }
  .ws-topbar .crumbs .sep { color: var(--mono-700); }
  .ws-topbar .crumbs .here { color: var(--fg); }

  .ws-stepper { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--rule); background: var(--mono-950); }
  .ws-step { padding: 14px 20px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; }
  .ws-step:last-child { border-right: 0; }
  .ws-step .head { display: flex; align-items: center; gap: 10px; font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono); text-transform: uppercase; color: var(--fg-meta); }
  .ws-step .head .n { font-family: var(--ff-serif); font-weight: 300; font-size: 32px; color: var(--fg); line-height: 1; letter-spacing: -0.04em; margin-right: 4px; }
  .ws-step .lbl { font-family: var(--ff-serif); font-weight: 400; font-size: var(--fs-18); line-height: 1.2; color: var(--fg); }
  .ws-step .meta-line { font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); color: var(--fg-meta); }
  .ws-step.is-done { background: transparent; }
  .ws-step.is-done .head { color: var(--status-success); }
  .ws-step.is-active { background: var(--mono-900); }
  .ws-step.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); box-shadow: 0 0 12px rgba(255,106,0,0.6); }
  .ws-step.is-active .head { color: var(--accent); }
  .ws-step.is-future .head, .ws-step.is-future .lbl, .ws-step.is-future .n { color: var(--fg-meta); }

  .ws-content { padding: 28px 32px; overflow: hidden; min-height: 0; }

  /* Graph treatment */
  .graph-canvas { background: var(--bg-sunken); border: 1px solid var(--rule); border-radius: var(--r-1); position: relative; height: 320px; overflow: hidden; }
  .graph-canvas::before { content: ""; position: absolute; inset: 0; background: var(--bg-grid); opacity: 0.7; }

  /* Modal mock */
  .modal-back { background: rgba(13,12,12,0.74); backdrop-filter: blur(2px); padding: 32px; border-radius: var(--r-1); }
  .modal { width: 520px; max-width: 100%; background: var(--bg-elevated); border: 1px solid var(--rule-strong); box-shadow: var(--shadow-modal); border-radius: var(--r-1); }

  /* Drawer mock */
  .drawer { background: var(--bg-elevated); border-left: 1px solid var(--rule-strong); width: 380px; height: 100%; box-shadow: var(--shadow-modal); }

  /* Command palette */
  .cmdk { width: 560px; background: var(--bg-elevated); border: 1px solid var(--rule-strong); border-radius: var(--r-1); box-shadow: var(--shadow-modal); }
  .cmdk-input { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
  .cmdk-input .glyph { font-family: var(--ff-mono); color: var(--fg-meta); }
  .cmdk-input input { flex: 1; background: transparent; border: 0; color: var(--fg); font-family: var(--ff-sans); font-size: var(--fs-16); outline: none; }
  .cmdk-result-set { padding: 8px 0; max-height: 380px; overflow: auto; }

  /* Log viewer */
  .log {
    background: #07060a;
    border: 1px solid var(--rule); border-radius: var(--r-1);
    padding: 14px 16px; font-family: var(--ff-mono); font-size: var(--fs-12);
    line-height: 1.55; color: var(--mono-200); max-height: 320px; overflow: auto;
  }
  .log .ts { color: var(--mono-600); }
  .log .lvl-info { color: var(--plasma-400); }
  .log .lvl-warn { color: var(--status-warn); }
  .log .lvl-err { color: var(--status-error); }
  .log .lvl-ok { color: var(--status-success); }
  .log .agent { color: var(--accent); }

  /* Toast */
  .toast {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 18px; background: var(--bg-elevated);
    border: 1px solid var(--rule-strong);
    border-left: 2px solid var(--accent);
    border-radius: var(--r-1);
    box-shadow: var(--shadow-popover);
    width: 360px;
  }
  .toast .body .title { font-family: var(--ff-sans); font-size: var(--fs-13); color: var(--fg); }
  .toast .body .desc { font-family: var(--ff-sans); font-size: var(--fs-12); color: var(--fg-body); margin-top: 4px; }
  .toast .body .meta { font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); text-transform: uppercase; color: var(--fg-meta); margin-top: 6px; }

  /* Persona / agent card */
  .persona { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--rule); }
  .persona .avatar {
    width: 56px; height: 56px;
    border: 1px solid var(--rule-strong);
    background: var(--bg-sunken);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ff-serif); font-size: 24px; font-weight: 400;
    color: var(--fg);
    position: relative;
  }
  .persona .avatar .ring {
    position: absolute; inset: -2px; border: 1px solid var(--accent); opacity: 0; pointer-events: none;
  }
  .persona.is-active .avatar .ring { opacity: 1; }
  .persona .name { font-family: var(--ff-serif); font-size: var(--fs-18); line-height: 1.15; }
  .persona .meta-line { font-family: var(--ff-mono); font-size: var(--fs-11); letter-spacing: var(--ls-mono-tight); color: var(--fg-meta); margin-top: 4px; }
  .persona .traits { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

  /* Density: small variant for workspace screens */
  .dense .field-label, .dense .meta-mono { font-size: 10px; }

  /* Numbered marker stamp */
  .stamp {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--ff-mono); font-size: 10px;
    letter-spacing: var(--ls-mono); text-transform: uppercase;
    color: var(--fg-meta);
    padding: 3px 7px; border: 1px solid var(--rule); border-radius: var(--r-1);
  }
  .stamp .n { color: var(--accent); }
</style>
</head>
<body>
