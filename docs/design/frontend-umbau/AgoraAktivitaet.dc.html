<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding-bottom:20px;box-sizing:border-box;">
  <div style="display:flex;align-items:center;gap:12px;margin-top:6px;flex:none;">
    <h1 style="margin:0;font-size:22px;font-weight:650;letter-spacing:-0.01em;">Aktivität</h1>
    <div role="tablist" style="display:flex;padding:2px;border-radius:8px;background:var(--s2);gap:2px;margin-left:8px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.onClick }}" style="height:28px;padding:0 12px;border:none;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};font-weight:{{ t.fw }};">{{ t.label }} <span style="color:var(--fg3);font-weight:400;">{{ t.count }}</span></button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ isJobs }}" hint-placeholder-val="{{ true }}">
    <div role="table" aria-label="Jobs" style="background:var(--s2);border-radius:12px;overflow:auto;min-height:0;">
      <div role="row" style="display:grid;grid-template-columns:130px minmax(0,1fr) 170px 150px 110px 90px 130px;gap:16px;padding:10px 20px;font-size:12px;font-weight:600;color:var(--fg3);">
        <span>Art</span><span>Lauf</span><span>Zustand</span><span>Fortschritt</span><span>Gestartet</span><span style="text-align:right;">Dauer</span><span></span>
      </div>
      <sc-for list="{{ jobs }}" as="j" hint-placeholder-count="7">
        <div role="row" style="display:grid;grid-template-columns:130px minmax(0,1fr) 170px 150px 110px 90px 130px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:13.5px;">
          <span style="font-weight:600;">{{ j.kind }}</span>
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0;"><a href="#" style="font-weight:500;">{{ j.run }}</a><span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--fg3);">{{ j.lid }}</span></span>
          <span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:999px;font-size:12px;font-weight:600;background:{{ j.badge.bg }};color:{{ j.badge.fg }};white-space:nowrap;">
            <sc-if value="{{ j.badge.spin }}"><span style="width:10px;height:10px;box-sizing:border-box;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:agspin 0.9s linear infinite;"></span></sc-if>
            <sc-if value="{{ j.badge.hasGlyph }}"><span style="font-size:10.5px;line-height:1;">{{ j.badge.glyph }}</span></sc-if>{{ j.badge.label }}</span></span>
          <span style="display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;">{{ j.prog }}<sc-if value="{{ j.hasBar }}"><span style="height:4px;border-radius:2px;background:var(--s4);overflow:hidden;"><span style="display:block;height:100%;width:{{ j.pct }};background:var(--fg);"></span></span></sc-if></span>
          <span style="color:var(--fg2);font-variant-numeric:tabular-nums;">{{ j.start }}</span>
          <span style="text-align:right;color:var(--fg2);font-variant-numeric:tabular-nums;">{{ j.dur }}</span>
          <span style="display:flex;justify-content:flex-end;"><sc-if value="{{ j.hasAct }}"><button style="height:30px;padding:0 12px;border:none;border-radius:8px;background:var(--s3);color:var(--fg);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;" style-hover="background:var(--s4)">{{ j.act }}</button></sc-if></span>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isLog }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;background:var(--s2);border-radius:12px;padding:14px 20px 4px;">
      <div style="flex:1;min-height:0;position:relative;"><dc-import name="AgoraLog" scope="alle" title="Alle Läufe" hint-size="100%,100%"></dc-import></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:700},&quot;init&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = {};
  renderVals() {
    const init = this.props.init || {};
    const tab = this.state.tab || init.tab || 'jobs';
    const B = {
      run: { bg: 'var(--s3)', fg: 'var(--fg)', label: 'Läuft', spin: true },
      queued: { bg: 'var(--s3)', fg: 'var(--fg2)', label: 'In Warteschlange', glyph: '○' },
      done: { bg: 'var(--ok-soft)', fg: 'var(--ok)', label: 'Fertig', glyph: '✓' },
      fallback: { bg: 'var(--warn-soft)', fg: 'var(--warn)', label: 'Mit Fallback', glyph: '↺' },
      budget: { bg: 'var(--warn-soft)', fg: 'var(--warn)', label: 'Budget erschöpft', glyph: '€' },
      failed: { bg: 'var(--err-soft)', fg: 'var(--err)', label: 'Fehlgeschlagen', glyph: '✕' },
    };
    const b = (k) => ({ spin: false, glyph: '', ...B[k], hasGlyph: !!B[k].glyph });
    const jobs = [
      ['Simulation', 'Risiken Brenkhausen', 'lauf_7f3a2c', 'run', 'Runde 11 von 24', '46%', '05.10., 14:10', '22 min', 'Abbrechen'],
      ['Interview', 'Kooperation Hebammen', 'lauf_a81f55', 'run', 'Frage 1 von 1', '60%', '05.10., 14:31', '8 s', 'Abbrechen'],
      ['Bericht', 'Kooperation Hebammen', 'lauf_a81f55', 'queued', 'wartet auf freien Platz', null, '—', '—', 'Abbrechen'],
      ['Graph-Aufbau', 'seed_document.md', 'lauf_19bd04', 'failed', 'abgebrochen in Schritt 1', null, '02.10., 11:05', '30 s', 'Erneut starten'],
      ['Simulation', 'Sicherstellungszuschlag', 'lauf_c2e910', 'budget', 'Runde 17 von 24', null, '03.10., 10:02', '46 min', null],
      ['Personas', 'Kooperation Hebammen', 'lauf_a81f55', 'fallback', '14 von 14, davon 4 Fallback', null, '04.10., 16:27', '3 min 31 s', null],
      ['Bericht', 'Anfahrtswege Moorhagen', 'lauf_e4410b', 'done', '7 von 7 Abschnitten', null, '30.09., 18:40', '3 min 52 s', null],
    ].map(([kind, run, lid, st, prog, pct, start, dur, act]) => ({ kind, run, lid, badge: b(st), prog, hasBar: !!pct, pct: pct || '0%', start, dur, hasAct: !!act, act: act || '' }));
    const seg = (on) => ({ bg: on ? 'var(--s4)' : 'transparent', fg: on ? 'var(--fg)' : 'var(--fg2)', fw: on ? 600 : 500 });
    return {
      tabs: [['jobs', 'Jobs', 7], ['protokoll', 'Protokoll', 12]].map(([k, label, count]) => ({ label, count, on: tab === k, ...seg(tab === k), onClick: () => this.setState({ tab: k }) })),
      isJobs: tab === 'jobs', isLog: tab === 'protokoll', jobs,
    };
  }
}
</script>
</body>
</html>
