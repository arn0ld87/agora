name: agora-observability

services:
  signoz-clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    profiles: ["observability"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - signoz-clickhouse-data:/var/lib/clickhouse
      # Single-Node Cluster-Config — OTel-Exporter brauchen Cluster "cluster"
      - ./deploy/observability/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    ports:
      - "127.0.0.1:9000:9000"

  signoz-zookeeper:
    # bitnami/zookeeper:3.7.1 wurde Mitte 2025 nach Bitnami-Strategiewechsel
    # vom Docker Hub entfernt. Offizielles Apache-Image als Drop-in-Ersatz.
    image: zookeeper:3.9
    profiles: ["observability"]
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok,stat"
      ZOO_STANDALONE_ENABLED: "true"
    volumes:
      - signoz-zookeeper-data:/data
      - signoz-zookeeper-datalog:/datalog

  # Schema-Migrator erstellt das ClickHouse-Schema (signoz_traces, signoz_metrics etc.)
  # Muss vor otel-collector und query-service fertig sein.
  signoz-schema-migrator:
    image: signoz/signoz-schema-migrator:0.102.3
    profiles: ["observability"]
    command:
      - "--dsn=tcp://signoz-clickhouse:9000"
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: on-failure

  signoz-query-service:
    image: signoz/query-service:0.51.0
    profiles: ["observability"]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
    environment:
      ClickHouseUrl: tcp://signoz-clickhouse:9000
      STORAGE: clickhouse
      ALERTMANAGER_API_PREFIX: http://signoz-alertmanager:9093/api/
      SIGNOZ_LOCAL_DB_PATH: /var/lib/signoz/signoz.db
    volumes:
      - signoz-query-data:/var/lib/signoz

  signoz-frontend:
    image: signoz/frontend:0.51.0
    profiles: ["observability"]
    depends_on: [signoz-query-service]
    ports:
      - "127.0.0.1:3301:3301"
    volumes:
      # Fix: Builtin nginx config hat "location = /api" (exact match) —
      # /api/v1/register und Subpfade wurden nie proxied → 405.
      - ./deploy/observability/signoz-frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  signoz-alertmanager:
    image: signoz/alertmanager:0.23.7
    profiles: ["observability"]
    depends_on: [signoz-query-service]

  otel-collector:
    # SigNoz-eigenes OTel-Collector-Image — muss DIESELBE Version wie der
    # signoz-schema-migrator haben, sonst gibt es Schema-Mismatch (Spaltenanzahl).
    # SigNoz v0.51.0 liefert standardmäßig 0.102.3.
    image: signoz/signoz-otel-collector:0.102.3
    profiles: ["observability"]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
    environment:
      - DOCKER_MULTI_NODE_CLUSTER=false
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"  # OTLP grpc
      - "127.0.0.1:4318:4318"  # OTLP http
    command: ["--config=/etc/otel/config.yaml"]

volumes:
  signoz-clickhouse-data:
  signoz-zookeeper-data:
  signoz-zookeeper-datalog:
  signoz-query-data:
