    <!-- Block B1 (18.08.2026): Archivo (UI) + Newsreader (Berichts-Fliesstext)
         kommen self-hosted via @fontsource-variable — siehe main.ts. Der
         Google-Fonts-CDN aus Slice D0 ist entfallen: Agora laeuft ueber
         Tailscale, ein externer Font-Request gehoert dort nicht hin. -->
    <script>
      // Dark ist das Hauptgesicht (Q2/Q28). Vor dem ersten Paint setzen,
      // sonst blitzt der ungestylte Grund auf.
      (function () {
        document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
