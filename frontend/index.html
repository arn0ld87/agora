<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="description" content="Agora — Multi-Agent Schwarmintelligenz-Simulator. Lokal. Privat. Entwickelt von Alexander Schneider (alexle135.de)." />
    <meta name="author" content="Alexander Schneider — alexle135.de" />
    <title>Agora — Schwarmintelligenz</title>
    <!-- Newsreader (Berichts-Fliesstext) kommt self-hosted via
         @fontsource-variable — siehe main.ts; die Oberflaeche nutzt die
         Systemschrift (#1795). Der
         Google-Fonts-CDN aus Slice D0 ist entfallen: Agora laeuft ueber
         Tailscale, ein externer Font-Request gehoert dort nicht hin. -->
    <script>
      // Hell/Dunkel nach System oder gespeicherter Wahl (#1795). Vor dem
      // ersten Paint setzen, sonst blitzt das falsche Theme auf. Gleiche Logik
      // und gleicher Schlüssel wie src/composables/useTheme.ts.
      (function () {
        var choice = 'system';
        try {
          var raw = localStorage.getItem('agora.theme');
          if (raw === 'light' || raw === 'dark' || raw === 'system') choice = raw;
        } catch (e) {}
        var dark = true;
        if (choice === 'system') {
          if (typeof window.matchMedia === 'function') {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } else {
          dark = choice === 'dark';
        }
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
