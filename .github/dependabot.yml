# Dependabot — automatisierte Dep-Updates für Agora.
# Doku: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Stack: Python (uv/pyproject) im Backend, npm im Frontend, Docker im Repo-Root,
# GitHub Actions in .github/workflows. Schedule wöchentlich Montag früh
# (Europe/Berlin), Gruppierung: minor+patch zusammenfassen, major einzeln.

version: 2

updates:
  # --- Python (Backend, pyproject.toml mit uv-Lock) ---
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # camel-ai wird durch camel-oasis==0.2.5 exakt auf 0.2.78 festgepinnt
    # (alle camel-oasis-Releases pinnen 0.2.78; kein Release erlaubt >=0.2.90).
    # Solange diese Upstream-Blockade besteht, sind camel-ai-Dependabot-Bumps
    # nicht mergbar (Backend-Gate bricht mit `No solution found`). Tracking:
    # Issue #806 (camel-oasis-Upstream-Release mit camel-ai>=0.2.90) und
    # #762 (Master-Thema Backend-Dependency-SSoT). Re-Aktivieren, sobald
    # camel-oasis>=0.2.6 verfügbar ist, das camel-ai>=0.2.90 akzeptiert.
    ignore:
      - dependency-name: "camel-ai"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Frontend (npm) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Docker (Dockerfile + compose-Files im Root) ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # --- GitHub Actions Workflows ---
  # Workflows pin Actions to full commit SHAs with trailing version comments
  # (for example: `uses: owner/action@<sha> # vN`). Dependabot keeps those refs
  # updateable while preserving SHA pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
