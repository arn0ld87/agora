name: contract-gates

# Drift-Checks: Schema-Drift, Status-Sync, Contract-Tests, Evidence-Quality,
# Zod-Mirror, Voice-Lint, Komplexitäts-Gate. Bewusst auf pull_request, damit
# Drift schon vor Merge gefangen wird statt erst auf main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-drift:
    name: Schema-Drift verhindern
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync backend deps
        working-directory: backend
        run: uv sync --group dev
      - name: Schema-Drift-Check (MAI-04)
        working-directory: backend
        # exit 1 bei nicht-committeten Schema-Aenderungen -> blockiert Merge.
        run: uv run python -m app.contracts.dump_schemas --check

  # 2026-05-17 entfernt: STATUS.md-Drift-Job. STATUS.md ist generierter
  # Audit-Output; die Drift-Checks haben PRs ständig rot gefärbt, ohne
  # einen echten Bug zu fangen. Wenn STATUS.md wieder aktiv kuratiert
  # wird, Job aus Git-History reaktivieren.

  contract-tests:
    name: Pydantic-Contract-Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip uv
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        run: uv run pytest tests/contracts/ -v

  evidence-quality:
    name: Evidence-Quality-Gate
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip uv
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        # M11.1 (2026-05-04): Hard-Gate.
        # Layer 5 ist grün → `--soft` entfernt. Schwellen 0.85 / 0.75 / 0.10
        # werden gegen den Mittelwert über die Good-Case-Fixtures
        # (`tests/eval/fixtures/good/*.json`) erzwungen. Bad-Case-Fixtures
        # liegen in `tests/eval/fixtures/bad/` und werden NICHT in den
        # Hard-Gate-Mittelwert eingerechnet — sie pinnen den Detector
        # via `tests/eval/test_eval_baselines.py` (Snapshot-Test gegen
        # `expected_metrics.json`). Damit fängt der Hard-Gate echten
        # Quality-Drift, ohne von absichtlich schlechten Fixtures
        # ausgehebelt zu werden.
        run: |
          uv run python scripts/check_evidence_quality.py \
            --fixtures tests/eval/fixtures/good \
            --min-evidence-coverage 0.85 \
            --min-claim-support-ratio 0.75 \
            --orphan-claim-rate 0.10 \
            --require-schema-version 2

  zod-mirror-drift:
    name: Frontend-Zod muss Backend-Schema spiegeln
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cd frontend && bun install --frozen-lockfile
      - name: Vitest - Sample-Payload muss Zod-strikt parsen
        run: cd frontend && bun run test -- --run src/contracts/

  voice-lint:
    name: Voice-Lint (DACH-Voice + Anti-Forecast)
    runs-on: ubuntu-latest
    # 2026-05-17: PR-Skip — Wording-Gate läuft nur noch auf push:main,
    # damit PRs nicht durch False-Positives bei Code-Kommentaren blockiert
    # werden. Reaktivieren: if-Zeile entfernen.
    if: github.event_name != 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip uv
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        # Hartmacher ab Sub-Slice 17 (Layer 5): Layer 2 (Wording-Glossar v1,
        # Sub-Slice 09+11) und Layer 3 haben alle verbotenen Forecast- und
        # Marketing-Phrasen aus report_prompts.py und report_agent.py entfernt.
        # --soft ist nicht mehr noetig -- Exit != 0 bei Treffern.
        run: uv run python scripts/check_voice.py

  complexity-gate:
    name: Komplexitaets-Gate (radon)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 2026-05-17: PR-Skip — Komplexitäts-Gate läuft nur auf push:main.
    # Reaktivieren: if-Zeile entfernen.
    if: github.event_name != 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install backend deps (inkl. radon)
        working-directory: backend
        run: uv sync --group dev
      - name: Cyclomatic-Complexity-Gate (MAI-17)
        # Schwelle: Class D+ (cc >= 21). Bestands-Hot-Spots in backend/radon-allowlist.txt.
        # Neue D/E/F-Funktionen ausserhalb der Allow-List → Exit 1.
        # Skript: backend/scripts/check_complexity.py (radon cc -j + allowlist-Match)
        run: cd backend && uv run python scripts/check_complexity.py
