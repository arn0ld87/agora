name: contract-gates

# Drift-Checks: Schema-Drift, Status-Sync, Contract-Tests, Evidence-Quality,
# Zod-Mirror, Voice-Lint, Komplexitäts-Gate. Bewusst auf pull_request, damit
# Drift schon vor Merge gefangen wird statt erst auf main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Veraltete PR-Laeufe abbrechen, sobald ein neuer Commit gepusht wird.
# push:main und workflow_dispatch laufen unangetastet zu Ende.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema-drift:
    name: Schema-Drift verhindern
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync backend deps
        working-directory: backend
        run: uv sync --group dev
      - name: Schema-Drift-Check (MAI-04)
        working-directory: backend
        # exit 1 bei nicht-committeten Schema-Aenderungen -> blockiert Merge.
        run: uv run python -m app.contracts.dump_schemas --check

  contract-tests:
    name: Pydantic-Contract-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip uv
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        run: uv run pytest tests/contracts/ -v

  evidence-quality:
    name: Evidence-Quality-Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip uv
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        # M11.1 (2026-05-04): Hard-Gate.
        # Layer 5 ist grün → `--soft` entfernt. Schwellen 0.85 / 0.75 / 0.10
        # werden gegen den Mittelwert über die Good-Case-Fixtures
        # (`tests/eval/fixtures/good/*.json`) erzwungen. Bad-Case-Fixtures
        # liegen in `tests/eval/fixtures/bad/` und werden NICHT in den
        # Hard-Gate-Mittelwert eingerechnet — sie pinnen den Detector
        # via `tests/eval/test_eval_baselines.py` (Snapshot-Test gegen
        # `expected_metrics.json`). Damit fängt der Hard-Gate echten
        # Quality-Drift, ohne von absichtlich schlechten Fixtures
        # ausgehebelt zu werden.
        run: |
          uv run python scripts/check_evidence_quality.py \
            --fixtures tests/eval/fixtures/good \
            --min-evidence-coverage 0.85 \
            --min-claim-support-ratio 0.75 \
            --orphan-claim-rate 0.10 \
            --require-schema-version 3

  zod-mirror-drift:
    name: Frontend-Zod muss Backend-Schema spiegeln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: cd frontend && bun install --frozen-lockfile
      - name: Vitest - Sample-Payload muss Zod-strikt parsen
        run: cd frontend && bun run test -- --run src/contracts/

  voice-lint:
    name: Voice-Lint (DACH-Voice + Anti-Forecast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 2026-05-17: PR-Skip — Wording-Gate läuft nur noch auf push:main,
    # damit PRs nicht durch False-Positives bei Code-Kommentaren blockiert
    # werden. Reaktivieren: if-Zeile entfernen.
    if: github.event_name != 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip uv
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        # Hartmacher ab Sub-Slice 17 (Layer 5): Layer 2 (Wording-Glossar v1,
        # Sub-Slice 09+11) und Layer 3 haben alle verbotenen Forecast- und
        # Marketing-Phrasen aus report_prompts.py und report_agent.py entfernt.
        # --soft ist nicht mehr noetig -- Exit != 0 bei Treffern.
        run: uv run python scripts/check_voice.py

  complexity-gate:
    name: Komplexitaets-Gate (radon)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 2026-05-17 bis 2026-08-17 lief dieses Gate per `if` nur auf push:main.
    # Ein PR konnte daran also nie scheitern: neue D+-Hotspots kamen ungehindert
    # durch und schlugen erst nach dem Merge auf main auf — wo sie niemanden
    # mehr blockierten, aber jeden lokalen `pre-push-gate.sh backend` rot
    # faerbten, bis jemand aufraeumte. Genau so kam
    # render_hypotheses_for_section (cc=21) in den Bestand. Das Gate prueft
    # ausschliesslich Zahlen und kennt keine False-Positives; der Grund fuer
    # den PR-Skip (siehe voice-lint) trifft hier nicht zu. Laeuft deshalb
    # wieder auf pull_request.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install backend deps (inkl. radon)
        working-directory: backend
        run: uv sync --group dev
      - name: Cyclomatic-Complexity-Gate (MAI-17)
        # Schwelle: Class D+ (cc >= 21). Bestands-Hot-Spots in backend/radon-allowlist.txt.
        # Neue D/E/F-Funktionen ausserhalb der Allow-List → Exit 1.
        # Skript: backend/scripts/check_complexity.py (radon cc -j + allowlist-Match)
        run: cd backend && uv run python scripts/check_complexity.py
