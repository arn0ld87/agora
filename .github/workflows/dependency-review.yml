name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Veraltete PR-Laeufe abbrechen (der Workflow laeuft ausschliesslich auf PRs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # api.deps.dev + api.securityscorecards.dev: dependency-review-action
          # hat show-openssf-scorecard standardmäßig aktiv und fetcht Scorecard-
          # Daten — unter blocked egress sonst "##[error]fetch failed"
          # (Run 27233669105, erster PR mit echten Dependency-Änderungen).
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
