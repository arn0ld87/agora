name: refactor-maintenance

on:
  push:
    branches:
      - claude/refactor-repo-loc-audit

permissions:
  contents: write

jobs:
  repair-runs-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/refactor-repo-loc-audit
      - name: Restore focused runs.py diff
        shell: bash
        run: |
          set -euo pipefail
          git checkout 2eb198758f1f90e7e8fc9b3256b97b6c4cfde786 -- backend/app/api/runs.py
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/api/runs.py')
          text = path.read_text(encoding='utf-8')
          old = '''from ..services.run_read_model import (\n    attach_summary as _attach_summary,\n    build_run_summary as _build_run_summary,\n)\n'''
          new = 'from ..services.run_read_model import attach_summary as _attach_summary\n'
          if old not in text:
              raise SystemExit('expected import block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code 2eb198758f1f90e7e8fc9b3256b97b6c4cfde786 -- backend/app/api/runs.py -- ':!backend/app/api/runs.py' || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api/runs.py
          git commit -m 'fix(runs): preserve focused import-only diff'
          git push origin HEAD:claude/refactor-repo-loc-audit
