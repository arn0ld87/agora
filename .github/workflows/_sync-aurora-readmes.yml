name: Sync AURORA reference sections

on:
  push:
    branches:
      - docs/fix-aurora-reference-run-1305

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-aurora-reference-run-1305
      - name: Sync root READMEs
        if: github.actor != 'github-actions[bot]'
        run: python .github/scripts/sync_aurora_readmes.py
      - name: Commit changes
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.de.md
          git commit -m 'docs: sync AURORA reference run in both root READMEs'
          git push origin HEAD:docs/fix-aurora-reference-run-1305
