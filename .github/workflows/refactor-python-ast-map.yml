name: refactor-python-ast-map

on:
  push:
    branches:
      - claude/refactor-python-hotspots

permissions:
  contents: read

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/refactor-python-hotspots
      - name: Print Python hotspot AST map
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          targets = [
              'backend/app/services/oasis_profile_generator.py',
              'backend/app/services/simulation_config_generator.py',
              'backend/app/api/simulation_prepare.py',
              'backend/app/services/prepare_service.py',
              'backend/app/services/sim/process_manager.py',
          ]

          def regex_map(src: str) -> None:
              for lineno, line in enumerate(src.splitlines(), 1):
                  m = re.match(r'^(\s*)(async\s+def|def|class)\s+([A-Za-z_][A-Za-z0-9_]*)', line)
                  if not m:
                      continue
                  indent = len(m.group(1).replace('\t', '    '))
                  kind = m.group(2).upper().replace(' ', '_')
                  print(f'FALLBACK {indent:02d} {kind} {m.group(3)} @ {lineno}')

          for name in targets:
              path = Path(name)
              src = path.read_text(encoding='utf-8')
              print(f'\n===== {name} ({len(src.splitlines())} LOC) =====')
              try:
                  tree = ast.parse(src)
              except SyntaxError as exc:
                  print(f'SYNTAX_ERROR line={exc.lineno}: {exc.msg}')
                  regex_map(src)
                  continue
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      print(f'FUNC {node.name}: {node.lineno}-{node.end_lineno} ({node.end_lineno-node.lineno+1})')
                  elif isinstance(node, ast.ClassDef):
                      print(f'CLASS {node.name}: {node.lineno}-{node.end_lineno} ({node.end_lineno-node.lineno+1})')
                      for child in node.body:
                          if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)):
                              print(f'  METHOD {child.name}: {child.lineno}-{child.end_lineno} ({child.end_lineno-child.lineno+1})')
          PY
