name: version-drift

# Detects version inconsistencies between pyproject.toml, package.json,
# README badge, and app/__init__.__version__ before they reach main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Veraltete PR-Laeufe abbrechen; push:main laeuft zu Ende.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-drift:
    name: Version-Drift-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend deps (dev group)
        working-directory: backend
        run: uv sync --group dev

      - name: Check version drift (standalone script)
        working-directory: backend
        run: uv run python scripts/check_version_drift.py

      - name: Run version-drift pytest tests
        working-directory: backend
        run: uv run pytest tests/scripts/test_check_version_drift.py -v
