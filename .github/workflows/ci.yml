name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'needs-python314'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.openai.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            generativelanguage.googleapis.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            api.github.com:443

      - name: Checkout full history for secret scan
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Export locked backend runtime requirements
        working-directory: backend
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-hashes \
            --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/agora-backend-requirements.txt \
            > /dev/null

      - name: Run Python dependency audit
        # CI-Welle 2026-05-16: pip-audit läuft NUR auf push:main + workflow_dispatch.
        # Auf PRs ist es Geschwindigkeits-Killer; CVE-Monitor (cve-monitor.yml,
        # wöchentlich) und Dependabot fangen Vulns ab.
        #
        # Temporary baseline: these advisories are pinned by upstream
        # dependencies (camel-oasis==0.2.5 / sentence-transformers==4.1.0)
        # or have no fixed release in the advisory DB (PYSEC-2026-139,
        # PYSEC-2025-217 — issues #623/#624).
        # Tracked in docs/dependency-risk-register.md. Hardstop 2026-07-30 —
        # afterwards this --ignore-vuln list MUST be empty.
        if: github.event_name != 'pull_request'
        run: |
          uvx pip-audit --strict --no-deps --disable-pip \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2025-217 \
            -r /tmp/agora-backend-requirements.txt

      - name: Set up Bun
        if: github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run frontend bun audit
        # CI-Welle 2026-05-16: bun-audit nur auf push:main (PR-Speed).
        # Dependabot + wöchentlicher CVE-Monitor decken PR-Lücke ab.
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: bun audit --audit-level=high

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    # 2026-05-17: PR-Skip — Backend-Tests laufen nur noch auf push:main.
    # Auf PR via Label 'needs-backend-ci' reaktivierbar. Reaktivieren ohne
    # Label: if-Zeile entfernen.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'needs-backend-ci')
    env:
      # Tests instantiate LLMClient() directly (e.g. test_ontology_generator);
      # the constructor rejects an empty API key. No HTTP calls are made.
      LLM_API_KEY: dummy-ci-key
      # Stay in dev mode so Config.validate() doesn't enforce the
      # AGORA_AUTH_TOKEN / SECRET_KEY policy on test runs.
      FLASK_DEBUG: "true"
    strategy:
      fail-fast: false
      # Python 3.14 ist seit Sub-Slice 41 (Issue #199 closed 2026-05-14)
      # die einzige unterstützte Runtime. Matrix bleibt für späteres
      # Multi-Version-Forward-Smoke offen, aktuell nur 3.14.
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run backend typecheck
        working-directory: backend
        run: uv run mypy app

      - name: Run backend tests with coverage gate (M11.2)
        working-directory: backend
        # Coverage-Flags bewusst hier statt in pyproject.toml addopts -- sonst
        # brechen Subset-Aufrufe wie `pytest tests/contracts/` in
        # contract-gates.yml. Schwelle 60 % = Step2 (Ist 66.00 %, vorgezogen
        # 2026-06-10). Roadmap +2 Punkte/Monat -> 85 %.
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        # CI-Welle 2026-05-16: Coverage-Artifact-Upload nur auf push:main —
        # PRs sehen Coverage-Werte im pytest-Output, Trend-Tracking läuft
        # über main-Artifacts.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    # 2026-05-17: PR-Skip — Frontend-CI läuft nur noch auf push:main.
    # Auf PR via Label 'needs-frontend-ci' reaktivierbar. Reaktivieren ohne
    # Label: if-Zeile entfernen.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'needs-frontend-ci')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Run frontend tests with coverage gate (M11.3)
        working-directory: frontend
        run: bun run test:coverage

      - name: Upload frontend coverage report
        # CI-Welle 2026-05-16: Coverage-Artifact-Upload nur auf push:main.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Run frontend build
        working-directory: frontend
        run: bun run build

  # 2026-05-17 entfernt: status-sync (MAI-16). Lief nur auf push:main,
  # doppelt sich mit dem alten contract-gates::status-sync-drift Job,
  # der ebenfalls entfernt wurde. STATUS.md bleibt manuell pflegbar.
