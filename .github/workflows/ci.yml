name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Export locked backend runtime requirements
        working-directory: backend
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-hashes \
            --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/agora-backend-requirements.txt \
            > /dev/null

      - name: Run Python dependency audit
        # Temporary baseline: these six advisories are pinned by
        # camel-oasis==0.2.5 / camel-ai==0.2.78 / sentence-transformers==3.0.0.
        # New pip-audit findings still fail the job.
        run: |
          uvx pip-audit --strict \
            --ignore-vuln CVE-2026-25990 \
            --ignore-vuln CVE-2026-40192 \
            --ignore-vuln CVE-2025-71176 \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln CVE-2024-46455 \
            --ignore-vuln CVE-2025-64712 \
            -r /tmp/agora-backend-requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    env:
      # Tests instantiate LLMClient() directly (e.g. test_ontology_generator);
      # the constructor rejects an empty API key. No HTTP calls are made.
      LLM_API_KEY: dummy-ci-key
      # Stay in dev mode so Config.validate() doesn't enforce the
      # AGORA_AUTH_TOKEN / SECRET_KEY policy on test runs.
      FLASK_DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      - name: Run Ruff (scoped rollout)
        working-directory: backend
        run: uv run ruff check app/__init__.py app/api/runs.py app/models/project.py app/services/run_registry.py app/services/report_agent.py app/services/simulation_ipc.py app/services/temporal_graph.py app/services/simulation_manager.py app/services/simulation_runner.py app/services/event_bus.py app/services/event_bus_redis.py app/services/graph_memory_updater.py app/services/graph_tools.py app/services/network_analytics.py app/services/ontology_generator.py app/services/ontology_mutation.py app/services/text_processor.py app/utils/api_responses.py app/utils/gpu_probe.py app/utils/json_io.py app/utils/logger.py app/utils/validation.py app/config.py app/storage/embedding_service.py app/storage/ner_extractor.py app/storage/search_service.py app/api/simulation.py app/api/simulation_common.py app/api/simulation_entities.py app/api/simulation_lifecycle.py app/api/simulation_prepare.py app/api/simulation_profiles.py app/api/simulation_run.py app/api/simulation_interviews.py app/api/simulation_history.py app/api/simulation_stream.py app/api/simulation_metrics.py app/api/graph.py app/api/report.py app/api/status.py app/utils/retry.py tests/test_api_responses.py tests/test_project_manager.py tests/test_run_registry.py tests/test_validation.py tests/test_simulation_api_routes.py tests/test_simulation_stream.py tests/test_embedding_service.py tests/test_event_bus.py tests/test_event_bus_redis.py tests/test_network_analytics.py tests/test_ontology_mutation.py tests/test_temporal_graph.py tests/test_report_manager.py tests/test_status.py tests/test_logging.py tests/test_neo4j_resilience.py tests/test_retry.py

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build
