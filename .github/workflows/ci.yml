name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.openai.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            generativelanguage.googleapis.com:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            api.github.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout full history for secret scan
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14-dev"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Export locked backend runtime requirements
        working-directory: backend
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-hashes \
            --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/agora-backend-requirements.txt \
            > /dev/null

      - name: Run Python dependency audit
        # Temporary baseline: these advisories are pinned by upstream
        # dependencies (camel-oasis==0.2.5 / sentence-transformers==3.0.0).
        # Tracked in docu/dependency-risk-register.md. Hardstop 2026-07-30 —
        # afterwards this --ignore-vuln list MUST be empty. The weekly
        # CVE-Monitor-Workflow (.github/workflows/cve-monitor.yml) enforces
        # the deadline by failing on/after 2026-07-30 if any of these CVEs
        # are still present in pip-audit's strict output.
        # New pip-audit findings still fail the job.
        #
        # Resolved (2026-05-15, pillow==12.2.0 via uv override-dependencies):
        #   CVE-2026-25990  pillow==10.3.0  via camel-ai      #121
        #   CVE-2026-40192  pillow==10.3.0  via camel-ai      #122
        #   CVE-2026-42308  pillow==10.3.0  via camel-oasis   #296
        #   CVE-2026-42310  pillow==10.3.0  via camel-oasis   #297
        #   CVE-2026-42311  pillow==10.3.0  via camel-oasis   #298
        #
        # Still open (upstream-blocked):
        # CVE-2025-71176  pytest==8.2.0    via camel-oasis   #123
        # CVE-2026-1839   transformers==4.57.6 via s-t       #124
        # CVE-2024-46455  unstructured==0.13.7 via camel-oasis #125
        # CVE-2025-64712  unstructured==0.13.7 via camel-oasis #126
        run: |
          uvx pip-audit --strict --no-deps --disable-pip \
            --ignore-vuln CVE-2025-71176 \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln CVE-2024-46455 \
            --ignore-vuln CVE-2025-64712 \
            -r /tmp/agora-backend-requirements.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run frontend bun audit
        working-directory: frontend
        run: bun audit --audit-level=high

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    env:
      # Tests instantiate LLMClient() directly (e.g. test_ontology_generator);
      # the constructor rejects an empty API key. No HTTP calls are made.
      LLM_API_KEY: dummy-ci-key
      # Stay in dev mode so Config.validate() doesn't enforce the
      # AGORA_AUTH_TOKEN / SECRET_KEY policy on test runs.
      FLASK_DEBUG: "true"
    strategy:
      fail-fast: false
      # PRs laufen nur gegen die stabile Runtime; 3.14-dev läuft auf main
      # (sowie via workflow_dispatch), damit jeder PR-Push nicht 2x Backend
      # bezahlt.
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.14-dev"]') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run backend typecheck
        working-directory: backend
        run: uv run mypy app

      - name: Run backend tests with coverage gate (M11.2)
        working-directory: backend
        # Coverage-Flags bewusst hier statt in pyproject.toml addopts -- sonst
        # brechen Subset-Aufrufe wie `pytest tests/contracts/` in
        # contract-gates.yml. Schwelle 60 % = Step2 (Ist 66.00 %, vorgezogen
        # 2026-06-10). Roadmap +2 Punkte/Monat -> 85 %.
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Run frontend tests with coverage gate (M11.3)
        working-directory: frontend
        run: bun run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Run frontend build
        working-directory: frontend
        run: bun run build

  status-sync:
    name: STATUS.md drift check (MAI-16)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies (collect-only)
        working-directory: backend
        run: uv sync --group dev

      - name: STATUS.md drift check (MAI-16)
        run: |
          bash scripts/sync-status.sh --check
        # exit 1 bei manuell editiertem STATUS.md ohne sync-status-Run
