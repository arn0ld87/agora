name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Veraltete PR-Laeufe abbrechen, sobald ein neuer Commit gepusht wird.
# Auf push:main und workflow_dispatch NICHT abbrechen — dort ist jeder Lauf
# ein eigenstaendiger Nachweis fuer genau einen main-Stand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'needs-python314'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.openai.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            generativelanguage.googleapis.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            api.github.com:443

      - name: Checkout full history for secret scan
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Gitleaks liest die Historie nur lokal und authentifiziert sich
          # ueber GITHUB_TOKEN im env, nicht ueber den Git-Credential-Helper.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Export locked backend runtime requirements
        working-directory: backend
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-hashes \
            --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/agora-backend-requirements.txt \
            > /dev/null

      - name: Run Python dependency audit
        # CI-Welle 2026-05-16: pip-audit läuft NUR auf push:main + workflow_dispatch.
        # Auf PRs ist es Geschwindigkeits-Killer; CVE-Monitor (cve-monitor.yml,
        # wöchentlich) und Dependabot fangen Vulns ab.
        #
        # CVE-2026-1839, CVE-2026-4372 und PYSEC-2025-217 resolved via
        # Transformers v5 upgrade (#624).
        # nltk 3.9.4 -> 3.10.1 (2026-08-02, #995) resolved PYSEC-2026-597 und
        # GHSA-p4gq-832x-fm9v (Alias CVE-2026-54293, PYSEC-2026-2078) fuer
        # pip-audit: GHSA-p4gq-832x-fm9v hat einen echten Upstream-Fix in
        # 3.10.0; PYSEC-2026-597 hat weiterhin keinen, faellt aber ab 3.10.0
        # aus dem affected-Set (OSV last_affected: 3.9.4) und wird deshalb
        # nicht mehr gemeldet — Details siehe docs/dependency-risk-register.md,
        # Abschnitt "nltk-Baseline". Issue #661 bleibt offen.
        # Tracked in docs/dependency-risk-register.md. Hardstop 2026-09-28
        # (verlängert 2026-07-06 via ADR-0004 / ALE-20; ehem. 2026-07-30) —
        # afterwards this --ignore-vuln list MUST be empty.
        # Tracked advisories: CVE-2026-1839, CVE-2026-4372, PYSEC-2025-217.
        if: github.event_name != 'pull_request'
        run: |
          uvx pip-audit --strict --no-deps --disable-pip \
            -r /tmp/agora-backend-requirements.txt

      - name: Set up Bun
        if: github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Run frontend bun audit
        # CI-Welle 2026-05-16: bun-audit nur auf push:main (PR-Speed).
        # Dependabot + wöchentlicher CVE-Monitor decken PR-Lücke ab.
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: bun audit --audit-level=high

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2026-05-17: PR-Skip — Backend-Tests laufen nur noch auf push:main.
    # Auf PR via Label 'needs-backend-ci' reaktivierbar. Reaktivieren ohne
    # Label: if-Zeile entfernen.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'needs-backend-ci')
    env:
      # Tests instantiate LLMClient() directly (e.g. test_ontology_generator);
      # the constructor rejects an empty API key. No HTTP calls are made.
      LLM_API_KEY: dummy-ci-key
      # Stay in dev mode so Config.validate() doesn't enforce the
      # AGORA_AUTH_TOKEN / SECRET_KEY policy on test runs.
      FLASK_DEBUG: "true"
    strategy:
      fail-fast: false
      # Python 3.14 ist seit Sub-Slice 41 (Issue #199 closed 2026-05-14)
      # die einzige unterstützte Runtime. Matrix bleibt für späteres
      # Multi-Version-Forward-Smoke offen, aktuell nur 3.14.
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run backend typecheck
        working-directory: backend
        run: uv run mypy app

      - name: Run backend tests with coverage gate (M11.2)
        working-directory: backend
        # Coverage-Flags bewusst hier statt in pyproject.toml addopts -- sonst
        # brechen Subset-Aufrufe wie `pytest tests/contracts/` in
        # contract-gates.yml. Schwelle 60 % = Step2 (Ist 66.00 %, vorgezogen
        # 2026-06-10). Roadmap +2 Punkte/Monat -> 85 %.
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        # CI-Welle 2026-05-16: Coverage-Artifact-Upload nur auf push:main —
        # PRs sehen Coverage-Werte im pytest-Output, Trend-Tracking läuft
        # über main-Artifacts.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2026-05-17: PR-Skip — Frontend-CI läuft nur noch auf push:main.
    # Auf PR via Label 'needs-frontend-ci' reaktivierbar. Reaktivieren ohne
    # Label: if-Zeile entfernen.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'needs-frontend-ci')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Run frontend tests with coverage gate (M11.3)
        working-directory: frontend
        run: bun run test:coverage

      - name: Upload frontend coverage report
        # CI-Welle 2026-05-16: Coverage-Artifact-Upload nur auf push:main.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Run frontend build
        working-directory: frontend
        run: bun run build

  backend-pr-gate:
    name: Backend PR smoke gate (ruff + mypy + pytest-contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on every PR — fast mandatory gate, no label required.
    # Heavy backend jobs (full coverage, matrix) remain in the 'backend' job on push:main.
    if: github.event_name == 'pull_request'
    env:
      LLM_API_KEY: dummy-ci-key
      FLASK_DEBUG: "true"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check app/ tests/

      - name: Mypy
        working-directory: backend
        run: uv run mypy app

      - name: Pytest contracts (fast subset)
        working-directory: backend
        run: uv run pytest tests/contracts/ -q

      # 2026-07-25 wieder aktiviert (Issue #883). Der 2026-05-17 entfernte Job
      # lief auf push:main und meldete Drift erst nach dem Merge. Hier laeuft er
      # auf dem PR und verhindert ihn. Kein eigener Job: uv, Dependencies und
      # Checkout stehen in diesem Gate bereits, und der Frontend-Zaehler braucht
      # nur das Repo. Exit 2 = Messfehler, nicht Drift.
      - name: STATUS.md drift check
        run: bash scripts/sync-status.sh --check

  frontend-pr-gate:
    name: Frontend PR smoke gate (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on every PR — fast mandatory gate, no label required.
    # Full test + coverage remain in the 'frontend' job on push:main.
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Unit tests
        working-directory: frontend
        run: bun run test

      - name: Build
        working-directory: frontend
        run: bun run build

  # 2026-05-17 entfernt: status-sync (MAI-16) als eigener Job — lief nur auf
  # push:main und doppelte sich mit contract-gates::status-sync-drift.
  # 2026-07-25 (Issue #883): Die Pruefung ist als Step im backend-pr-gate
  # zurueck, wo sie auf dem PR laeuft statt nach dem Merge. Kein eigener Job,
  # daher auch keine Doppelung mehr.
