name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Export locked backend runtime requirements
        working-directory: backend
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-hashes \
            --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/agora-backend-requirements.txt \
            > /dev/null

      - name: Run Python dependency audit
        # Temporary baseline: these six advisories are pinned by upstream
        # dependencies (camel-oasis==0.2.5 / camel-ai==0.2.78 /
        # sentence-transformers==3.0.0). Tracked in
        # docu/dependency-risk-register.md. Expires 2026-07-30.
        # New pip-audit findings still fail the job.
        run: |
          uvx pip-audit --strict \
            --ignore-vuln CVE-2026-25990   # pillow==10.3.0  via camel-ai  #121 \
            --ignore-vuln CVE-2026-40192   # pillow==10.3.0  via camel-ai  #122 \
            --ignore-vuln CVE-2025-71176   # pytest==8.2.0   via camel-oasis #123 \
            --ignore-vuln CVE-2026-1839    # transformers==4.57.6 via s-t  #124 \
            --ignore-vuln CVE-2024-46455   # unstructured==0.13.7 via c-o #125 \
            --ignore-vuln CVE-2025-64712   # unstructured==0.13.7 via c-o #126 \
            -r /tmp/agora-backend-requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    env:
      # Tests instantiate LLMClient() directly (e.g. test_ontology_generator);
      # the constructor rejects an empty API key. No HTTP calls are made.
      LLM_API_KEY: dummy-ci-key
      # Stay in dev mode so Config.validate() doesn't enforce the
      # AGORA_AUTH_TOKEN / SECRET_KEY policy on test runs.
      FLASK_DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      - name: Run Ruff (app/ tests/, mirrors npm run lint:backend)
        working-directory: backend
        run: uv run ruff check app/ tests/

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Run frontend build
        working-directory: frontend
        run: npm run build
