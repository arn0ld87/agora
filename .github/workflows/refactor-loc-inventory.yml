name: refactor-loc-inventory

on:
  push:
    branches:
      - claude/refactor-repo-loc-audit

permissions:
  contents: write

jobs:
  exact-loc-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/refactor-repo-loc-audit
      - name: Generate exact tracked-source LOC inventory
        shell: bash
        env:
          BASE_SHA: 4496d7ad425593ec12084e508d3f148be9a4166e
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import os
          import subprocess
          from collections import Counter
          from pathlib import Path

          EXTENSIONS = {'.py', '.ts', '.tsx', '.vue', '.js', '.sh'}
          EXCLUDED_PARTS = {
              'node_modules', 'vendor', 'vendors', 'dist', 'build', '.venv', 'venv',
              'coverage', '__pycache__', 'design', 'third_party', 'third-party',
          }
          GENERATED_PARTS = {'generated', 'gen'}
          BASE_SHA = os.environ['BASE_SHA']

          def tracked_files() -> list[str]:
              raw = subprocess.check_output(['git', 'ls-files', '-z'])
              return [p.decode('utf-8') for p in raw.split(b'\0') if p]

          def line_count_text(text: str) -> int:
              return len(text.splitlines())

          def is_test(path: str) -> bool:
              parts = set(Path(path).parts)
              name = Path(path).name.lower()
              return bool(
                  parts & {'test', 'tests', '__tests__'}
                  or name.startswith('test_')
                  or '.spec.' in name
                  or '.test.' in name
              )

          def generated_reason(path: str, text: str) -> str | None:
              parts = set(Path(path).parts)
              if parts & EXCLUDED_PARTS:
                  return 'excluded-directory'
              if parts & GENERATED_PARTS:
                  return 'generated-directory'
              head = '\n'.join(text.splitlines()[:8]).lower()
              markers = ('do not edit', 'auto-generated', 'autogenerated', 'generated file')
              if any(marker in head for marker in markers):
                  return 'generated-marker'
              return None

          def priority(loc: int) -> str:
              if loc > 800:
                  return 'P0'
              if loc >= 501:
                  return 'P1'
              if loc >= 351:
                  return 'P2'
              if loc >= 251:
                  return 'P3'
              return '-'

          rows: list[dict[str, object]] = []
          excluded: list[tuple[str, str]] = []
          for path in tracked_files():
              p = Path(path)
              if p.suffix.lower() not in EXTENSIONS or not p.is_file():
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              reason = generated_reason(path, text)
              if reason:
                  excluded.append((path, reason))
                  continue
              loc = line_count_text(text)
              rows.append({
                  'path': path,
                  'loc': loc,
                  'priority': priority(loc),
                  'kind': 'test' if is_test(path) else 'production',
                  'extension': p.suffix.lower(),
              })

          rows.sort(key=lambda row: (-int(row['loc']), str(row['path'])))
          prod = [row for row in rows if row['kind'] == 'production']
          tests = [row for row in rows if row['kind'] == 'test']

          out_dir = Path('docs/refactor')
          out_dir.mkdir(parents=True, exist_ok=True)

          with (out_dir / 'loc-inventory.tsv').open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=['path', 'loc', 'priority', 'kind', 'extension'],
                  delimiter='\t',
              )
              writer.writeheader()
              writer.writerows(rows)

          def table(lines: list[dict[str, object]]) -> str:
              result = ['| Prio | LOC | Datei |', '|---|---:|---|']
              for row in lines:
                  result.append(f"| {row['priority']} | {row['loc']} | `{row['path']}` |")
              return '\n'.join(result)

          priorities = Counter(str(row['priority']) for row in prod)
          test_priorities = Counter(str(row['priority']) for row in tests)
          hot_prod = [row for row in prod if row['priority'] != '-']
          hot_tests = [row for row in tests if row['priority'] != '-']

          before_after: list[tuple[str, int | None, int]] = []
          for path in (
              'backend/app/api/runs.py',
              'backend/app/services/run_read_model.py',
              'backend/app/services/sim/monitor.py',
              'backend/app/services/sim/run_metrics.py',
          ):
              current = line_count_text(Path(path).read_text(encoding='utf-8')) if Path(path).exists() else 0
              try:
                  before_text = subprocess.check_output(
                      ['git', 'show', f'{BASE_SHA}:{path}'], stderr=subprocess.DEVNULL
                  ).decode('utf-8', errors='replace')
                  before = line_count_text(before_text)
              except subprocess.CalledProcessError:
                  before = None
              before_after.append((path, before, current))

          md: list[str] = [
              '# Exaktes LOC-Inventar',
              '',
              f'Basis für Vorher-Vergleiche: `{BASE_SHA}`.',
              '',
              '## Messmethode',
              '',
              '- Quelle: `git ls-files`; gezählt werden logische Textzeilen (`splitlines()`).',
              '- Quelltypen: `.py`, `.ts`, `.tsx`, `.vue`, `.js`, `.sh`.',
              '- Tests werden vollständig erfasst, aber getrennt von Produktionscode bewertet.',
              '- `design/`, Vendor-/Build-/Dist-Verzeichnisse und Dateien mit eindeutigem Generated-Header werden aus der Produktionsrangliste ausgeschlossen.',
              '- Schwellen: P0 >800, P1 501–800, P2 351–500, P3 251–350 LOC.',
              '',
              '## Gesamtbild',
              '',
              f'- Produktionsdateien erfasst: **{len(prod)}**',
              f'- Testdateien erfasst: **{len(tests)}**',
              f"- Produktions-Hotspots: **P0 {priorities['P0']}**, **P1 {priorities['P1']}**, **P2 {priorities['P2']}**, **P3 {priorities['P3']}**",
              f"- Test-Hotspots separat: **P0 {test_priorities['P0']}**, **P1 {test_priorities['P1']}**, **P2 {test_priorities['P2']}**, **P3 {test_priorities['P3']}**",
              f'- Ausgeschlossene Source-artige Dateien: **{len(excluded)}**',
              '',
              '## Produktionscode ab P3',
              '',
              table(hot_prod),
              '',
              '## Große Tests ab P3',
              '',
              table(hot_tests) if hot_tests else '_Keine Testdatei ab 251 LOC._',
              '',
              '## Vorher/Nachher der umgesetzten Slices',
              '',
              '| Datei | Vorher | Nachher | Delta |',
              '|---|---:|---:|---:|',
          ]
          for path, before, after in before_after:
              before_label = 'neu' if before is None else str(before)
              delta = 'neu' if before is None else f'{after - before:+d}'
              md.append(f'| `{path}` | {before_label} | {after} | {delta} |')

          md.extend(['', '## Ausgeschlossene Dateien', ''])
          if excluded:
              md.extend(f'- `{path}`: {reason}' for path, reason in sorted(excluded))
          else:
              md.append('_Keine._')

          md.extend([
              '',
              '## Vollständige Rohdaten',
              '',
              'Alle erfassten Quelldateien stehen maschinenlesbar in `docs/refactor/loc-inventory.tsv`.',
              '',
          ])
          (out_dir / 'loc-inventory.md').write_text('\n'.join(md), encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/refactor-loc-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/refactor/loc-inventory.md docs/refactor/loc-inventory.tsv
          git commit -m 'docs(refactor): add exact tracked-source LOC inventory'
          git push origin HEAD:claude/refactor-repo-loc-audit
