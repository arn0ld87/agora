name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
    # Doku-only-PRs (z.B. Doku-Sync-Slices) sollen den Smoke nicht triggern.
    # Code-/Compose-/Workflow-Änderungen lösen ihn aus.
    paths-ignore:
      - '**.md'
      - 'docu/**'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-only:
    # Schritt 1: Image bauen, NICHT pushen.
    # Das Image wird als Artefakt gespeichert und im smoke-Job geladen.
    # Damit wird sichergestellt, dass kein kaputtes Image in die Registry
    # gelangt, bevor der End-to-End-Smoke-Test grün ist.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
            ghcr.io/${{ github.repository_owner }}/agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest
            type=ref,event=branch

      - name: Build image (kein Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # push: false — kein Push in dieser Phase.
          # Image wird lokal als tar exportiert und per upload-artifact
          # an den smoke-Job weitergegeben.
          push: false
          # Deterministischer CI-Tag für docker load + docker tag im smoke-Job.
          # Compose erwartet das Image unter "agora-agora:latest" (Default-
          # Compose-Projektname "agora" + Service "agora"). Mit diesem Tag
          # können wir das geladene Image direkt umbenennen.
          tags: agora-agora:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-Cache beschleunigt den zweiten Build im publish-Job auf
          # nahezu null (alle Layers bereits gecacht).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Image-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          # Artefakt wird nur für den Workflow-Run benötigt; 1 Tag reicht.
          retention-days: 1

  prod-proxy-smoke:
    name: Smoke-Test Reverse-Proxy-Stack
    runs-on: ubuntu-latest
    needs: [build-only]
    # Tag-Pushes: externe Abhängigkeiten (Neo4j-Pull, Ollama) können den
    # Smoke instabil machen. Mit continue-on-error blockiert ein instabiler
    # Smoke den Release nicht — main-Pushes und PR-Smokes sind dagegen strikt
    # smoke-gated, weil AGORA_SKIP_EMBEDDING_PROBE=true die Ollama-Abhängigkeit
    # beim Container-Startup eliminiert (Issue #276). Die statische
    # KNOWN_EMBEDDING_DIMS-Validation bleibt aktiv; nur der Live-HTTP-Probe-Call
    # gegen das Embedding-Backend wird übersprungen.
    continue-on-error: ${{ github.ref_type == 'tag' }}
    # CI-Test-Werte für Single-User-Tailnet-Smoke-Variante.
    # Keine echten Secrets nötig: NEO4J_PASSWORD muss nur nicht leer sein
    # (Compose-Gate), AGORA_AUTH_TOKEN/VITE_AGORA_TOKEN sind Smoke-Dummies.
    env:
      NEO4J_PASSWORD: ci_smoke_neo4j
      AGORA_AUTH_TOKEN: ci_smoke_token
      VITE_AGORA_TOKEN: ci_smoke_vite_token
      # SECRET_KEY/LLM_API_KEY werden von Config.validate() in non-debug erzwungen.
      # Werte sind CI-Smoke-Dummies, kein Produktions-Geheimnis.
      SECRET_KEY: ci_smoke_secret_key_for_prod_proxy_smoke_only_not_a_real_secret
      LLM_API_KEY: ollama
      ALLOW_BUILD_TIME_TOKEN: "true"
      AGORA_BIND_HOST: "0.0.0.0"
      # Ollama ist im CI-Runner nicht verfügbar. Skip-Flag verhindert den
      # Live-HTTP-Probe-Call beim Container-Startup (Issue #276). Die statische
      # KNOWN_EMBEDDING_DIMS-Validation läuft weiterhin.
      AGORA_SKIP_EMBEDDING_PROBE: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Image-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Image laden und für Compose umtaggen
        # Das geladene Image hat den CI-Tag "agora-agora:ci-<sha>".
        # Compose erwartet das Image unter "agora-agora:latest" (Projektname
        # "agora" + Service "agora" → Default-Image-Name ohne --build).
        # Mit "docker tag" machen wir das Image für Compose sichtbar, ohne
        # dass Compose selbst baut (kein --build im up-Aufruf).
        run: |
          docker load -i /tmp/image.tar
          docker tag agora-agora:ci-${{ github.sha }} agora-agora:latest

      - name: Frontend-Bundle bauen
        # nginx mountet ./frontend/dist als Host-Bind-Mount (docker-compose.prod-with-proxy.yml).
        # Der Dockerfile-prod-Builder erzeugt dist nur im Image-Kontext, nicht auf dem Host.
        # Daher muss der Bundle-Build hier explizit auf dem Runner laufen.
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: CI-Umgebungsdatei generieren
        run: |
          printf 'VITE_AGORA_TOKEN=%s\nAGORA_AUTH_TOKEN=%s\nNEO4J_PASSWORD=%s\nSECRET_KEY=%s\nLLM_API_KEY=%s\nAGORA_DEBUG=false\nAGORA_BIND_HOST=0.0.0.0\nAGORA_SKIP_EMBEDDING_PROBE=%s\n' \
            "$VITE_AGORA_TOKEN" "$AGORA_AUTH_TOKEN" "$NEO4J_PASSWORD" "$SECRET_KEY" "$LLM_API_KEY" "$AGORA_SKIP_EMBEDDING_PROBE" > .env

      - name: Compose-Stack starten
        # Kein --build: das Image ist bereits geladen (docker load oben).
        # ALLOW_BUILD_TIME_TOKEN=true: CI ist Single-User-Tailnet-Variante,
        # Token-Bundle-Einbrennen ist in diesem Kontext zulässig (N6/F2.1).
        # AGORA_BIND_HOST=0.0.0.0: Backend muss auf allen Interfaces erreichbar
        # sein, damit der nginx-Sidecar agora:5001 im Compose-Netz erreicht.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f deploy/compose/docker-compose.prod-with-proxy.yml \
            up -d

      - name: Auf Proxy-Health warten
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/healthz; then
              echo "Proxy bereit"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Healthz-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200
              docker inspect agora-nginx 2>/dev/null || true
              docker inspect agora 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Auf Backend-Health warten (Race vor verify-deploy.sh vermeiden)
        # nginx kommt schneller hoch als gunicorn+gevent+Neo4j-Connection.
        # Ohne diesen Wait läuft verify-deploy.sh los während Backend noch
        # "health: starting" ist und /health/api/* via Proxy 502 returnt.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/health >/dev/null 2>&1; then
              echo "Backend bereit (über Proxy)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Backend-Health-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200 agora
              exit 1
            fi
            sleep 5
          done

      - name: Verify-Skript ausfuehren
        run: bash scripts/verify-deploy.sh

      - name: Logs sammeln (immer)
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
          docker inspect agora-nginx 2>/dev/null || true
          docker inspect agora 2>/dev/null || true

      - name: Stack abraeumen
        if: always()
        run: docker compose down -v

  publish:
    # Schritt 3: Push zu Docker Hub + GHCR — NUR nach erfolgreichem Smoke.
    # main-Pushes: smoke muss grün sein (needs: prod-proxy-smoke, kein
    # continue-on-error auf dem publish-Job).
    # tag-Pushes: prod-proxy-smoke läuft mit continue-on-error: true, deshalb
    # prüft die if-Bedingung success() || github.ref_type == 'tag', damit
    # ein instabiler Smoke den Release nicht blockiert, main-Builds aber
    # strikt smoke-gated bleiben.
    runs-on: ubuntu-latest
    needs: [prod-proxy-smoke]
    if: >-
      github.event_name != 'pull_request' &&
      (success() || github.ref_type == 'tag')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
            ghcr.io/${{ github.repository_owner }}/agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest
            type=ref,event=branch

      - name: Build und Push (mit GHA-Cache)
        # Alle Layers sind durch den build-only-Job bereits im GHA-Cache.
        # Dieser Build läuft praktisch instant durch (cache-hit auf alle
        # Layers) und schreibt das fertige Image in beide Registries.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Einziger Push im Workflow — NUR hier, nach erfolgreichem Smoke.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
