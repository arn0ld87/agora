name: Build and push Docker image

on:
  # Bewusst kein pull_request-Trigger:
  # Der Prod-Proxy-Smoke läuft ca. 30 Minuten und ist auf Feature-PRs
  # zu teuer. Stattdessen läuft er auf main, Release-/RC-Branches,
  # Tags und manuellem Dispatch. Vor einem Release manuell anstoßen.
  push:
    branches:
      - main
      - "release/**"
      - "rc/**"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Break-glass: publish despite a failed smoke on a manual run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-only:
    # Schritt 1: Image bauen, NICHT pushen.
    # Das Image wird als Artefakt gespeichert und im smoke-Job geladen.
    # Damit wird sichergestellt, dass kein kaputtes Image in die Registry
    # gelangt, bevor der End-to-End-Smoke-Test grün ist.
    # Läuft auf jedem push (main, release/**, rc/**, tags) und workflow_dispatch.
    # Kein pull_request mehr — siehe Header-Kommentar.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
            ghcr.io/${{ github.repository_owner }}/agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build image (kein Push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          # push: false — kein Push in dieser Phase.
          # Image wird lokal als tar exportiert und per upload-artifact
          # an den smoke-Job weitergegeben.
          push: false
          # Deterministischer CI-Tag für docker load + docker tag im smoke-Job.
          # Compose erwartet das Image unter "agora-agora:latest" (Default-
          # Compose-Projektname "agora" + Service "agora"). Mit diesem Tag
          # können wir das geladene Image direkt umbenennen.
          tags: agora-agora:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-Cache beschleunigt den zweiten Build im publish-Job auf
          # nahezu null (alle Layers bereits gecacht).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Blocking mode: Fail on HIGH/CRITICAL findings.
          # Documented upstream blockers are managed via .trivyignore.
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Image-Artefakt hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          # Artefakt wird nur für den Workflow-Run benötigt; 1 Tag reicht.
          retention-days: 1

  prod-proxy-smoke:
    name: Smoke-Test Reverse-Proxy-Stack
    runs-on: ubuntu-latest
    needs: [build-only]
    # Smoke läuft automatisch auf release-relevanten Pfaden und workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/rc/')))
    permissions:
      contents: read
    # CI-Test-Werte für Single-User-Tailnet-Smoke-Variante.
    # Keine echten Secrets nötig: NEO4J_PASSWORD muss nur nicht leer sein
    # (Compose-Gate), AGORA_AUTH_TOKEN/VITE_AGORA_TOKEN sind Smoke-Dummies.
    env:
      NEO4J_PASSWORD: ci_smoke_neo4j
      AGORA_AUTH_TOKEN: ci_smoke_token
      VITE_AGORA_TOKEN: ci_smoke_vite_token
      # SECRET_KEY/LLM_API_KEY werden von Config.validate() in non-debug erzwungen.
      # Werte sind CI-Smoke-Dummies, kein Produktions-Geheimnis.
      SECRET_KEY: ci_smoke_secret_key_for_prod_proxy_smoke_only_not_a_real_secret
      LLM_API_KEY: ollama
      ALLOW_BUILD_TIME_TOKEN: "true"
      AGORA_BIND_HOST: "0.0.0.0"
      # Ollama ist im CI-Runner nicht verfügbar. Skip-Flag verhindert den
      # Live-HTTP-Probe-Call beim Container-Startup (Issue #276). Die statische
      # KNOWN_EMBEDDING_DIMS-Validation läuft weiterhin.
      AGORA_SKIP_EMBEDDING_PROBE: "true"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Image-Artefakt herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Image laden und für Compose umtaggen
        # Das geladene Image hat den CI-Tag "agora-agora:ci-<sha>".
        # Compose erwartet das Image unter "agora-agora:latest" (Projektname
        # "agora" + Service "agora" → Default-Image-Name ohne --build).
        # Mit "docker tag" machen wir das Image für Compose sichtbar, ohne
        # dass Compose selbst baut (kein --build im up-Aufruf).
        run: |
          docker load -i /tmp/image.tar
          docker tag agora-agora:ci-${{ github.sha }} agora-agora:latest

      - name: Frontend-Bundle aus gebautem Image extrahieren
        # nginx mountet ./frontend/dist als Host-Bind-Mount (docker-compose.prod-with-proxy.yml).
        # Der Smoke muss exakt das Bundle aus dem bereits gebauten Prod-Image
        # validieren, nicht einen zweiten Runner-Build.
        run: |
          rm -rf frontend/dist
          mkdir -p frontend
          cid="$(docker create agora-agora:ci-${{ github.sha }})"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/app/frontend/dist" ./frontend/dist
          docker rm "$cid"
          trap - EXIT

      - name: CI-Umgebungsdatei generieren
        run: |
          printf 'VITE_AGORA_TOKEN=%s\nAGORA_AUTH_TOKEN=%s\nNEO4J_PASSWORD=%s\nSECRET_KEY=%s\nLLM_API_KEY=%s\nAGORA_DEBUG=false\nAGORA_BIND_HOST=0.0.0.0\nAGORA_SKIP_EMBEDDING_PROBE=%s\n' \
            "$VITE_AGORA_TOKEN" "$AGORA_AUTH_TOKEN" "$NEO4J_PASSWORD" "$SECRET_KEY" "$LLM_API_KEY" "$AGORA_SKIP_EMBEDDING_PROBE" > .env

      - name: Bind-Mount-Verzeichnisse fuer Container-UID vorbereiten
        # GitHub-Runner-Workspace gehoert uid 1001, der Prod-Container laeuft als
        # uid 1000 (`USER agora`). Bei Bind-Mounts bleiben die Host-Rechte
        # erhalten, daher braucht der Smoke-Test hier eine explizit beschreibbare
        # uploads-Registry auf dem Runner.
        run: |
          mkdir -p backend/uploads/run_registry
          command -v setfacl >/dev/null 2>&1 || { echo "::error::setfacl fehlt auf dem Runner"; exit 1; }
          setfacl -m u:1000:rwx backend/uploads backend/uploads/run_registry

      - name: Compose-Stack starten
        # Kein --build: das Image ist bereits geladen (docker load oben).
        # ALLOW_BUILD_TIME_TOKEN=true: CI ist Single-User-Tailnet-Variante,
        # Token-Bundle-Einbrennen ist in diesem Kontext zulässig (N6/F2.1).
        # AGORA_BIND_HOST=0.0.0.0: Backend muss auf allen Interfaces erreichbar
        # sein, damit der nginx-Sidecar agora:5001 im Compose-Netz erreicht.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f deploy/compose/docker-compose.prod-with-proxy.yml \
            up -d

      - name: Auf Proxy-Health warten
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/healthz; then
              echo "Proxy bereit"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Healthz-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200
              docker inspect agora-nginx 2>/dev/null || true
              docker inspect agora 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Auf Backend-Health warten (Race vor verify-deploy.sh vermeiden)
        # nginx kommt schneller hoch als gunicorn+gevent+Neo4j-Connection.
        # Ohne diesen Wait läuft verify-deploy.sh los während Backend noch
        # "health: starting" ist und /health/api/* via Proxy 502 returnt.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/health >/dev/null 2>&1; then
              echo "Backend bereit (über Proxy)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Backend-Health-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200 agora
              exit 1
            fi
            sleep 5
          done

      - name: Verify-Skript ausfuehren
        run: bash scripts/verify-deploy.sh

      - name: Logs sammeln (immer)
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
          docker inspect agora-nginx 2>/dev/null || true
          docker inspect agora 2>/dev/null || true

      - name: Stack abraeumen
        if: always()
        run: docker compose down -v

  publish:
    # Schritt 3: Push zu GHCR — NUR nach erfolgreichem Smoke.
    # Docker Hub bleibt ein optionaler Mirror. Der harte Release-Pfad ist GHCR,
    # weil Docker Hub grosse Layer im GitHub-Runner wiederholt mit HTTP 400
    # abweisen kann, obwohl der Reverse-Proxy-Smoke gruen war.
    # Tags haben keinen Bypass mehr. Nur ein manueller workflow_dispatch mit
    # force_publish=true darf als Break-glass-Pfad publishen, wenn der Smoke rot
    # war; normale Releases bleiben strikt smoke-gated.
    runs-on: ubuntu-latest
    needs: [prod-proxy-smoke]
    if: ${{ always() && (needs.prod-proxy-smoke.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.force_publish == true)) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Docker Hub (optional mirror)
        continue-on-error: true
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract GHCR metadata
        id: meta_ghcr
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build und Push zu GHCR (required)
        id: build_ghcr
        # Alle Layers sind durch den build-only-Job bereits im GHA-Cache.
        # Dieser Build läuft praktisch instant durch (cache-hit auf alle
        # Layers) und schreibt das fertige Image in die Pflicht-Registry.
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          # Erster harter Push im Workflow — NUR nach erfolgreichem Smoke.
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate GHCR build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agora
          subject-digest: ${{ steps.build_ghcr.outputs.digest }}
          push-to-registry: true

      - name: Generate GHCR SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/agora@${{ steps.build_ghcr.outputs.digest }}
          format: spdx-json
          output-file: agora-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload GHCR SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agora-ghcr-sbom-spdx
          path: agora-image.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Extract Docker Hub metadata (optional mirror)
        id: meta_dockerhub
        continue-on-error: true
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build und Push zu Docker Hub (optional mirror)
        continue-on-error: true
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
