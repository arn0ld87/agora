name: Build and push Docker image

on:
  # Build+Trivy (build-only) läuft auf jedem relevanten Push (main,
  # release/**, rc/**, tags) und auf PRs mit pfadgefilterten Änderungen
  # (Dockerfile, Compose, deploy/, backend/, frontend/, dieser Workflow).
  # build-only baut BEIDE ausgelieferten Images: agora (target prod) und
  # agora-proxy (target proxy, nginx + Frontend-Bundle, Default-Build-Args).
  # Smoke (prod-proxy-smoke) laeuft nur auf Release-/RC-Branches, Tags und
  # manuellem Dispatch. Registry-Push (publish) laeuft dort nach gruenem
  # Smoke (vX.Y.Z, latest) und zusaetzlich auf jedem main-Push nach gruenem
  # build-only (sha-<7>, edge) — ohne Smoke, Gate ist Build + Trivy (#1708).
  # PRs publizieren nie.
  push:
    branches: [main, "release/**", "rc/**"]
    tags: ["v*"]
  pull_request:
    # build-only muss fuer alle Repo-Aenderungen laufen, die das Docker-Image
    # oder die Workflow-Logik beeinflussen koennen. Eine zu enge paths-Liste
    # fuehrt dazu, dass der Required Check auf "Expected — Waiting for status
    # to be reported" stehenbleibt, weil der Workflow gar nicht startet (Issue
    # aus CHANGELOG-Eintrag 2026-07-28). Die fruehere Luecke wurde fuer
    # Docs-PRs geschlossen; .gitignore/.dockerignore/aenderungen an anderen
    # Workflows waren weiter ungetriggert.
    paths:
      - Dockerfile
      - "docker-compose*.yml"
      - ".dockerignore"
      - ".gitignore"
      - "deploy/**"
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Break-glass: publish despite a failed smoke on a manual run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Nur PR-Laeufe werden abgebrochen. push/tag-Laeufe NICHT: publish schiebt nach
# GHCR, ein Abbruch mitten im Push wuerde eine halb hochgeladene Tag-Referenz
# hinterlassen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-only:
    # Schritt 1: Image bauen, NICHT pushen.
    # Das Image wird als Artefakt gespeichert und im smoke-Job geladen.
    # Damit wird sichergestellt, dass kein kaputtes Image in die Registry
    # gelangt, bevor der End-to-End-Smoke-Test grün ist.
    # Läuft auf jedem push (main, release/**, rc/**, tags), auf PRs mit
    # relevanten Pfad-Änderungen (siehe pull_request.paths oben) und auf
    # workflow_dispatch. Kein if:-Guard — Build+Trivy ist blocking für alle
    # Trigger. Smoke-/Push-Gating siehe prod-proxy-smoke/publish weiter unten.
    # Alle Trigger laufen auf `ubuntu-latest`, also amd64 — ohne Sonderfall.
    #
    # Vorher zeigten push/tag/dispatch auf den self-hosted Runner `meinserver`.
    # Das hatte zwei Mängel. Erstens funktionierte es nicht: der Runner läuft
    # als Container ohne gemounteten Docker-Socket, weshalb `Set up Docker
    # Buildx` ausnahmslos mit "Cannot connect to the Docker daemon" abbrach —
    # seit Einrichtung schlug damit jeder push-auf-main-Lauf fehl und es
    # gelangte kein Image mehr nach GHCR. Zweitens wäre die naheliegende
    # Reparatur (Socket-Mount) an einem öffentlichen Repository ein
    # Root-Äquivalent auf einem Host, der weitere Dienste trägt.
    #
    # Der Zwischenschritt `ubuntu-24.04-arm` hätte beides gelöst und dabei
    # einen dritten Mangel geerbt, den der kaputte Runner nur verdeckt hat:
    # `build-only` reicht sein Image an `prod-proxy-smoke` weiter, und der
    # läuft auf `ubuntu-latest`. Ein arm64-Artefakt startet dort nicht.
    # Aufgefallen ist das nie, weil `build-only` vorher immer abbrach und der
    # Smoke-Job deshalb nie zum Zug kam.
    #
    # Ausgeliefert werden seit dieser Aenderung linux/amd64 UND linux/arm64
    # (Multi-Arch-Manifest in GHCR). build-only baut und prueft bewusst nur
    # amd64: Trivy und der Smoke laufen auf `ubuntu-latest`, ein arm64-Image
    # startet dort nicht. Die arm64-Variante entsteht erst im publish-Job,
    # nativ auf `ubuntu-24.04-arm` (kein QEMU). armserver ist aarch64 und zieht
    # die arm64-Variante seit #1708 per deploy/compose/docker-compose.ghcr.yml.
    # Kein abweichender Runner fuer build-only.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      # Das Image-Artefakt hat genau EINEN Konsumenten: prod-proxy-smoke.
      # Dessen if:-Guard laesst nur workflow_dispatch, Tags und Release-/RC-
      # Branches durch — auf einem PR-Lauf wird der Job geskippt, publish
      # haengt an ihm und wird ebenfalls geskippt. Das Artefakt wird dort
      # also nie heruntergeladen, waehrend der Upload den vollen Prod-Tar
      # (venv inklusive CUDA-Kette, > 1,6 GB) durch den Runner schiebt.
      # Diese Bedingung MUSS mit der in prod-proxy-smoke identisch bleiben.
      IMAGE_ARTIFACT_NEEDED: >-
        ${{ github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/rc/') }}
    steps:
      - name: Harden Runner
        # Läuft jetzt für alle Trigger: die Einschränkung auf `pull_request`
        # existierte nur, weil der self-hosted Runner produktiven Traffic
        # trug und die maschinenweiten Egress-Regeln ihn getroffen hätten.
        # Auf einem GitHub-gehosteten Runner gibt es diesen Konflikt nicht,
        # und der Egress-Schutz ist auf dem push-Pfad — dem einzigen, der
        # veröffentlicht — am wertvollsten.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            claude.ai:443
            deb.debian.org:80
            deb.debian.org:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            check.trivy.dev:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            downloads.claude.ai:443
            files.pythonhosted.org:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Platz auf dem Runner schaffen
        # Das Prod-Image traegt die volle Backend-venv inklusive der
        # CUDA-Wheels. Zusammen mit /tmp/image.tar und dem Cache-Export
        # reicht der freie Speicher des Runners nicht — der Build brach
        # in genau dieser Kombination ohne Fehlermeldung ab (#994).
        # Die geloeschten SDKs werden von keinem Schritt dieses Jobs benutzt.
        run: |
          echo "vorher:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift || true
          echo "nachher:"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
            ghcr.io/${{ github.repository_owner }}/agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build image (kein Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Ohne target: baut BuildKit die LETZTE Stage des Dockerfiles (aktuell
          # "proxy", das nginx-Sidecar-Image) statt des App-Runtime-Images.
          # target: prod stellt sicher, dass Trivy und der prod-proxy-smoke-Job
          # das tatsaechliche Produktions-Image scannen/starten (#994). Das
          # separate nginx-Image baut deploy/compose/docker-compose.prod-with-
          # proxy.yml bereits eigenstaendig mit target: proxy.
          target: prod
          # push: false — kein Push in dieser Phase.
          # Image wird lokal als tar exportiert und per upload-artifact
          # an den smoke-Job weitergegeben.
          push: false
          # Deterministischer CI-Tag für docker load + docker tag im smoke-Job.
          # Compose erwartet das Image unter "agora-agora:latest" (Default-
          # Compose-Projektname "agora" + Service "agora"). Mit diesem Tag
          # können wir das geladene Image direkt umbenennen.
          tags: agora-agora:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-Cache beschleunigt den zweiten Build im publish-Job.
          #
          # mode=min statt mode=max: mode=max exportiert die Layer *aller*
          # Stages, also auch backend-build mit den CUDA-Wheels (cudnn ~700 MB,
          # nvshmem ~300 MB, siehe Dockerfile base-Stage). Solange hier
          # versehentlich die proxy-Stage gebaut wurde (nginx:alpine, wenige MB),
          # fiel das nicht auf. Mit target: prod (#994) sprengt der Export
          # zusammen mit /tmp/image.tar den Speicher des GitHub-Runners — der
          # Build brach im Cache-Export ohne Fehlermeldung ab.
          # mode=min exportiert nur die Layer des finalen Images; der
          # Cache-Nutzen für den publish-Build bleibt erhalten.
          #
          # scope=prod: Das Proxy-Image unten schreibt in denselben GHA-Cache.
          # Ohne getrennte Scopes ueberschreibt der zweite Export den ersten,
          # und publish baut das Prod-Image ohne Cache-Treffer neu.
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=min,scope=prod
          outputs: type=docker,dest=/tmp/image.tar

      - name: Build proxy image (kein Push)
        # Das nginx-Sidecar mit eingebackenem Frontend-Bundle ist das zweite
        # ausgelieferte Image (ghcr.io/<owner>/agora-proxy, #1708). Es wird
        # hier gebaut, nicht erst im Smoke-Job: dort sperrt die Egress-
        # Allowlist dl-cdn.alpinelinux.org, deb.debian.org und
        # registry.npmjs.org, und der Compose-Build hing bis zum Job-Timeout
        # (v0.9.6, Run 35517075897 — publish wurde deshalb nie erreicht).
        # Build-Args bleiben auf den Dockerfile-Defaults: kein Build-Time-
        # Token im Bundle, weil dieses Image oeffentlich publiziert wird.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: proxy
          push: false
          # Compose-Default-Name fuer Service "nginx" im Projekt "agora".
          tags: agora-nginx:ci-${{ github.sha }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=min,scope=proxy
          outputs: type=docker,dest=/tmp/proxy-image.tar

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Blocking mode: Fail on HIGH/CRITICAL findings.
          # Documented upstream blockers are managed via .trivyignore.
          exit-code: "1"
          ignore-unfixed: true
          # Ohne dieses Flag ignoriert die trivy-action im SARIF-Modus den
          # severity-Filter ("Building SARIF report with all severities") —
          # der exit-code feuert dann auf JEDE fixbare CVE, auch MEDIUM/LOW.
          # Genau so haben zwei neue MEDIUM-pypdf-CVEs am 2026-08-08 alle
          # PRs blockiert, obwohl das Gate laut severity nur CRITICAL,HIGH
          # hart ziehen soll.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Trivy proxy image scan
        # Gleiche Policy wie das Prod-Image: das Proxy-Image wird ebenfalls
        # publiziert und muss dasselbe Gate passieren.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/proxy-image.tar
          format: sarif
          output: trivy-proxy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy proxy SARIF
        if: always() && hashFiles('trivy-proxy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-proxy.sarif
          category: trivy-proxy

      - name: Trivy config scan (Dockerfile, Compose)
        # Prüft Dockerfile- und Compose-Fehlkonfigurationen (root-User,
        # fehlende HEALTHCHECK, privilegierte Container). Erst berichtend:
        # Funde landen im Code-Scanning-Tab, blockieren aber keinen PR,
        # bis die Baseline gesichtet ist.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Trivy config SARIF
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Image fuer SBOM in Docker-Daemon laden
        # outputs: type=docker exportiert in /tmp/image.tar, laedt aber NICHT
        # automatisch in den Daemon. sbom-action braucht ein daemon-sichtiges
        # Image; wir laden es einmalig hier.
        #
        # Danach existiert das Image zweimal auf der Platte: als Tar unter
        # /tmp und als Layer im Daemon. Braucht dieser Lauf das Artefakt
        # nicht, faellt der Tar hier weg — die SBOM-Erzeugung laeuft dann
        # nicht mehr gegen die Speicherobergrenze, an der #994 schon einmal
        # ohne Fehlermeldung abgebrochen ist.
        run: |
          docker load -i /tmp/image.tar
          if [ "${IMAGE_ARTIFACT_NEEDED}" != "true" ]; then
            echo "Kein Konsument fuer die Image-Tars in diesem Lauf — Dateien freigegeben."
            rm -f /tmp/image.tar /tmp/proxy-image.tar
            df -h / | tail -1
          fi

      - name: SBOM fuer Container-Image erzeugen
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: agora-agora:ci-${{ github.sha }}
          format: spdx-json
          output-file: agora-image-build.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM als Artefakt hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agora-image-sbom-spdx
          path: agora-image-build.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Image-Artefakt hochladen
        # Nur wenn prod-proxy-smoke in diesem Lauf ueberhaupt startet — siehe
        # IMAGE_ARTIFACT_NEEDED am Job-Kopf. Ohne diesen Guard lud jeder PR
        # einen mehrere Gigabyte grossen Tar hoch, den kein Job je abholt.
        if: env.IMAGE_ARTIFACT_NEEDED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: |
            /tmp/image.tar
            /tmp/proxy-image.tar
          # Artefakt wird nur für den Workflow-Run benötigt; 1 Tag reicht.
          retention-days: 1

  prod-proxy-smoke:
    name: Smoke-Test Reverse-Proxy-Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-only]
    # Smoke läuft NUR auf release-relevanten Pfaden und workflow_dispatch —
    # nicht auf normalen main-Pushes oder PRs (siehe Header-Kommentar).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/rc/')
    permissions:
      contents: read
    # CI-Test-Werte für Single-User-Tailnet-Smoke-Variante.
    # Keine echten Secrets nötig: NEO4J_PASSWORD muss nur nicht leer sein
    # (Compose-Gate), AGORA_AUTH_TOKEN ist ein Smoke-Dummy. Ein Build-Time-
    # Token fuers Frontend gibt es hier nicht mehr: der Smoke startet das
    # Proxy-Image aus build-only, also genau das Bundle, das publiziert wird
    # (Default-Args, Runtime-Login). verify-deploy.sh authentisiert per Header.
    env:
      NEO4J_PASSWORD: ci_smoke_neo4j
      AGORA_AUTH_TOKEN: ci_smoke_token
      # SECRET_KEY/LLM_API_KEY werden von Config.validate() in non-debug erzwungen.
      # Werte sind CI-Smoke-Dummies, kein Produktions-Geheimnis.
      SECRET_KEY: ci_smoke_secret_key_for_prod_proxy_smoke_only_not_a_real_secret
      LLM_API_KEY: ollama
      AGORA_BIND_HOST: "0.0.0.0"
      # Ollama ist im CI-Runner nicht verfügbar. Skip-Flag verhindert den
      # Live-HTTP-Probe-Call beim Container-Startup (Issue #276). Die statische
      # KNOWN_EMBEDDING_DIMS-Validation läuft weiterhin.
      AGORA_SKIP_EMBEDDING_PROBE: "true"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Image-Artefakt herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Images laden und für Compose umtaggen
        # Die geladenen Images tragen die CI-Tags "agora-agora:ci-<sha>" und
        # "agora-nginx:ci-<sha>". Compose erwartet sie unter den Default-
        # Namen (Projekt "agora" + Service "agora"/"nginx") mit :latest.
        run: |
          docker load -i /tmp/image.tar
          docker load -i /tmp/proxy-image.tar
          docker tag agora-agora:ci-${{ github.sha }} agora-agora:latest
          docker tag agora-nginx:ci-${{ github.sha }} agora-nginx:latest

      - name: CI-Umgebungsdatei generieren
        # AGORA_PROXY_PORT=80: Der Proxy bindet seit dem Loopback-Default auf
        # 127.0.0.1:8080; die Health-Waits unten und verify-deploy.sh curlen
        # aber http://localhost (Port 80). Im CI-Smoke explizit 80 setzen.
        run: |
          printf 'AGORA_AUTH_TOKEN=%s\nNEO4J_PASSWORD=%s\nSECRET_KEY=%s\nLLM_API_KEY=%s\nAGORA_DEBUG=false\nAGORA_BIND_HOST=0.0.0.0\nAGORA_PROXY_PORT=80\nAGORA_SKIP_EMBEDDING_PROBE=%s\n' \
            "$AGORA_AUTH_TOKEN" "$NEO4J_PASSWORD" "$SECRET_KEY" "$LLM_API_KEY" "$AGORA_SKIP_EMBEDDING_PROBE" > .env

      - name: Bind-Mount-Verzeichnisse fuer Container-UID vorbereiten
        # GitHub-Runner-Workspace gehoert uid 1001, der Prod-Container laeuft als
        # uid 1000 (`USER agora`). Bei Bind-Mounts bleiben die Host-Rechte
        # erhalten, daher braucht der Smoke-Test hier eine explizit beschreibbare
        # uploads-Registry auf dem Runner.
        run: |
          mkdir -p backend/uploads/run_registry
          command -v setfacl >/dev/null 2>&1 || { echo "::error::setfacl fehlt auf dem Runner"; exit 1; }
          setfacl -m u:1000:rwx backend/uploads backend/uploads/run_registry

      - name: Compose-Stack starten
        # --no-build: Beide Images kommen aus build-only (docker load oben).
        # Fehlt eines, bricht Compose sofort ab, statt still einen Build zu
        # starten, den die Egress-Allowlist dieses Jobs nicht durchlaesst
        # (genau das liess den Smoke bei v0.9.6 in den Timeout laufen, #1708).
        # AGORA_BIND_HOST=0.0.0.0: Backend muss auf allen Interfaces erreichbar
        # sein, damit der nginx-Sidecar agora:5001 im Compose-Netz erreicht.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f deploy/compose/docker-compose.prod-with-proxy.yml \
            up -d --no-build

      - name: Auf Proxy-Health warten
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/healthz; then
              echo "Proxy bereit"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Healthz-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200
              docker inspect agora-nginx 2>/dev/null || true
              docker inspect agora 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Auf Backend-Health warten (Race vor verify-deploy.sh vermeiden)
        # nginx kommt schneller hoch als gunicorn+gevent+Neo4j-Connection.
        # Ohne diesen Wait läuft verify-deploy.sh los während Backend noch
        # "health: starting" ist und /health/api/* via Proxy 502 returnt.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/health >/dev/null 2>&1; then
              echo "Backend bereit (über Proxy)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Backend-Health-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200 agora
              exit 1
            fi
            sleep 5
          done

      - name: Verify-Skript ausfuehren
        run: bash scripts/verify-deploy.sh

      - name: Logs sammeln (immer)
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
          docker inspect agora-nginx 2>/dev/null || true
          docker inspect agora 2>/dev/null || true

      - name: Stack abraeumen
        if: always()
        run: docker compose down -v

  publish-build:
    # Schritt 3a: Pro Plattform bauen und per Digest nach GHCR schieben, OHNE
    # Tags. Erst der publish-Job setzt die Tags auf das Multi-Arch-Manifest.
    # arm64 laeuft nativ auf `ubuntu-24.04-arm` statt unter QEMU. Gleiches
    # Smoke-Gate wie publish (siehe dort).
    name: publish-build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [build-only, prod-proxy-smoke]
    if: >-
      ${{ always() && needs.build-only.result == 'success' && (
        needs.prod-proxy-smoke.result == 'success' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prod-proxy-smoke.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' && inputs.force_publish == true)
      ) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
            cache_suffix: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
            cache_suffix: -arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            claude.ai:443
            deb.debian.org:80
            deb.debian.org:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            downloads.claude.ai:443
            files.pythonhosted.org:443
            ghcr.io:443
            index.docker.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur fuer die Labels (org.opencontainers.image.source verknuepft das
      # Package mit dem Repo). Tags setzt der publish-Job.
      - name: Extract GHCR metadata
        id: meta_ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora

      - name: Build und Push per Digest zu GHCR (agora)
        id: build_ghcr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # target: prod — siehe Kommentar im build-only-Job weiter oben (#994).
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/agora,push-by-name=true,name-canonical=true,push=true
          # amd64 nutzt den Cache aus build-only (scope=prod); arm64 hat einen
          # eigenen Scope, damit sich die Plattformen nicht ueberschreiben.
          cache-from: type=gha,scope=prod${{ matrix.cache_suffix }}
          cache-to: type=gha,mode=min,scope=prod${{ matrix.cache_suffix }}

      - name: Extract GHCR proxy metadata
        id: meta_proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora-proxy

      - name: Build und Push per Digest zu GHCR (agora-proxy)
        id: build_proxy
        # Default-Build-Args: kein Token im Bundle, das Image ist oeffentlich.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: proxy
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta_proxy.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/agora-proxy,push-by-name=true,name-canonical=true,push=true
          cache-from: type=gha,scope=proxy${{ matrix.cache_suffix }}
          cache-to: type=gha,mode=min,scope=proxy${{ matrix.cache_suffix }}

      - name: Export digests
        env:
          AGORA_DIGEST: ${{ steps.build_ghcr.outputs.digest }}
          PROXY_DIGEST: ${{ steps.build_proxy.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/agora-${AGORA_DIGEST#sha256:}"
          touch "${RUNNER_TEMP}/digests/proxy-${PROXY_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # Schritt 3b: Multi-Arch-Manifest (amd64 + arm64) in GHCR erzeugen und taggen —
    # NUR nach erfolgreichem Smoke. Die Images pushen die publish-build-Jobs
    # per Digest; hier entstehen Manifest, Tags, Provenance und SBOM.
    # Docker Hub bleibt ein optionaler Mirror. Der harte Release-Pfad ist GHCR,
    # weil Docker Hub grosse Layer im GitHub-Runner wiederholt mit HTTP 400
    # abweisen kann, obwohl der Reverse-Proxy-Smoke gruen war.
    # Tags haben keinen Bypass mehr. Nur ein manueller workflow_dispatch mit
    # force_publish=true darf als Break-glass-Pfad publishen, wenn der Smoke rot
    # war; normale Releases bleiben strikt smoke-gated.
    #
    # main-Pushes (#1708): Dort laeuft kein Smoke (result == 'skipped'). Sie
    # publizieren trotzdem, aber nur unter sha-<7> und edge — nie unter einem
    # Versions-Tag oder latest. Gate ist der gruene build-only-Job (Build,
    # Trivy fuer beide Images, SBOM). Damit kann armserver jeden main-Stand
    # ziehen, statt ihn unter Last selbst zu bauen.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-only, prod-proxy-smoke, publish-build]
    if: >-
      ${{ always() && needs.build-only.result == 'success' && needs.publish-build.result == 'success' && (
        needs.prod-proxy-smoke.result == 'success' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prod-proxy-smoke.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' && inputs.force_publish == true)
      ) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # *.sigstore.dev: attest-build-provenance signiert bei oeffentlichen
      # Repos ueber die Public-Good-Instanz von Sigstore (Zertifikat von
      # Fulcio, Transparenzlog bei Rekor, Trust-Root per TUF). Ohne diese drei
      # scheiterte der erste echte Publish (Run 36426266682) mit ECONNREFUSED
      # auf fulcio.sigstore.dev, nach dem Push von agora und vor dem
      # Proxy-Image (#1708).
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            claude.ai:443
            deb.debian.org:80
            deb.debian.org:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            downloads.claude.ai:443
            files.pythonhosted.org:443
            ghcr.io:443
            index.docker.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            *.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub (optional mirror)
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract GHCR metadata
        id: meta_ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora
          # Tag-Schema (#1708), fuer agora und agora-proxy identisch:
          #   sha-<7>  jeder Publish, unveraenderlich — Deploy- und Rollback-Pin
          #   edge     letzter gruener main-Stand (ohne Smoke)
          #   vX.Y.Z   Release-Tag, nur nach gruenem Smoke
          #   latest   letzter Release-Tag, nur nach gruenem Smoke
          #   <branch> release/**, rc/** (main heisst edge)
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Manifest-Liste zu GHCR erzeugen (agora)
        id: build_ghcr
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/agora
          META_JSON: ${{ steps.meta_ghcr.outputs.json }}
        run: |
          set -euo pipefail
          files=(agora-*); test "${#files[@]}" -eq 2
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON")
          refs=$(for f in agora-*; do printf '%s@sha256:%s ' "$IMAGE" "${f#agora-}"; done)
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          first=$(jq -r '.tags[0]' <<< "$META_JSON")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate GHCR build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agora
          subject-digest: ${{ steps.build_ghcr.outputs.digest }}
          push-to-registry: true

      - name: Generate GHCR SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/agora@${{ steps.build_ghcr.outputs.digest }}
          format: spdx-json
          output-file: agora-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload GHCR SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agora-ghcr-sbom-spdx
          path: agora-image.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Extract GHCR proxy metadata
        id: meta_proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora-proxy
          # Identisch zum agora-Tag-Schema oben: ein Deploy pinnt beide Images
          # auf denselben sha-<7>-Tag (deploy/compose/docker-compose.ghcr.yml).
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Manifest-Liste zu GHCR erzeugen (agora-proxy)
        id: build_proxy
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/agora-proxy
          META_JSON: ${{ steps.meta_proxy.outputs.json }}
        run: |
          set -euo pipefail
          files=(proxy-*); test "${#files[@]}" -eq 2
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON")
          refs=$(for f in proxy-*; do printf '%s@sha256:%s ' "$IMAGE" "${f#proxy-}"; done)
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          first=$(jq -r '.tags[0]' <<< "$META_JSON")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate GHCR proxy build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agora-proxy
          subject-digest: ${{ steps.build_proxy.outputs.digest }}
          push-to-registry: true

      - name: Generate GHCR proxy SBOM
        # agora-proxy wird genauso oeffentlich publiziert wie agora; ohne
        # eigene SBOM waere das Freigabekriterium "Release-Artefakte,
        # Checksummen und SBOM vorhanden" nur fuer ein Image erfuellt (#1661).
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/agora-proxy@${{ steps.build_proxy.outputs.digest }}
          format: spdx-json
          output-file: agora-proxy-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Release-Checksummen erzeugen (SHA256SUMS)
        # Die Images selbst sind ueber ihren Manifest-Digest adressiert; die
        # Digest-Datei haelt fest, welche zwei Digests zu diesem Lauf gehoeren.
        # SHA256SUMS deckt Digest-Datei und beide SBOMs ab. Verifikation:
        # docs/runbooks/release-artefakte-pruefen.md (#1661).
        env:
          OWNER: ${{ github.repository_owner }}
          AGORA_DIGEST: ${{ steps.build_ghcr.outputs.digest }}
          PROXY_DIGEST: ${{ steps.build_proxy.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'ghcr.io/%s/agora@%s\nghcr.io/%s/agora-proxy@%s\n' \
            "$OWNER" "$AGORA_DIGEST" "$OWNER" "$PROXY_DIGEST" > agora-image-digests.txt
          sha256sum agora-image.spdx.json agora-proxy-image.spdx.json agora-image-digests.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Release-Artefakte hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agora-release-artifacts
          path: |
            SHA256SUMS
            agora-image.spdx.json
            agora-proxy-image.spdx.json
            agora-image-digests.txt
          if-no-files-found: error
          retention-days: 90

      - name: Extract Docker Hub metadata (optional mirror)
        id: meta_dockerhub
        # Der Mirror laeuft nur auf Release-Pfaden. Auf jedem main-Push die
        # Prod-Layer zusaetzlich zu Docker Hub zu schieben, kostet Minuten und
        # scheitert dort erfahrungsgemaess mit HTTP 400 (siehe Job-Kopf).
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: Build und Push zu Docker Hub (optional mirror)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # target: prod — siehe Kommentar im build-only-Job weiter oben (#994).
          target: prod
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          # mode=min — siehe Begründung im build-only-Job weiter oben (#994).
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=min,scope=prod

  release-assets:
    # Schritt 4 (#1661): SHA256SUMS, Digest-Datei und beide SBOMs ans GitHub
    # Release haengen — nur bei v*-Tags. Eigener Job, damit das Schreibrecht auf
    # Repository-Inhalte nicht im Build-/Push-Pfad liegt. always() haelt den Break-glass-Pfad
    # offen: ein per force_publish erfolgreicher publish bekommt ebenfalls
    # seine Checksummen, obwohl der Smoke in der Kette rot war.
    #
    # Existiert das Release noch nicht (Tag gepusht, `gh release create` aus
    # docs/release-process.md §9 noch nicht gelaufen), legt der Job einen
    # Draft an. Der Maintainer veroeffentlicht ihn dann mit `gh release edit`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    if: ${{ always() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Release-Artefakte herunterladen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agora-release-artifacts
          path: release-artifacts

      - name: Checksummen pruefen
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS

      - name: An GitHub Release anhaengen
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Agora $TAG" \
              --notes "Entwurf aus docker-image.yml. Release Notes folgen nach docs/release-process.md §9."
          fi
          gh release upload "$TAG" --clobber \
            SHA256SUMS \
            agora-image.spdx.json \
            agora-proxy-image.spdx.json \
            agora-image-digests.txt
