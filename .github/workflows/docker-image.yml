name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agora-agora
            ghcr.io/${{ github.repository_owner }}/agora
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  prod-proxy-smoke:
    name: Smoke-Test Reverse-Proxy-Stack
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # CI-Test-Werte für Single-User-Tailnet-Smoke-Variante.
    # Keine echten Secrets nötig: NEO4J_PASSWORD muss nur nicht leer sein
    # (Compose-Gate), AGORA_AUTH_TOKEN/VITE_AGORA_TOKEN sind Smoke-Dummies.
    env:
      NEO4J_PASSWORD: ci_smoke_neo4j
      AGORA_AUTH_TOKEN: ci_smoke_token
      VITE_AGORA_TOKEN: ci_smoke_vite_token
      # SECRET_KEY/LLM_API_KEY werden von Config.validate() in non-debug erzwungen.
      # Werte sind CI-Smoke-Dummies, kein Produktions-Geheimnis.
      SECRET_KEY: ci_smoke_secret_key_for_prod_proxy_smoke_only_not_a_real_secret
      LLM_API_KEY: ollama
      ALLOW_BUILD_TIME_TOKEN: "true"
      AGORA_BIND_HOST: "0.0.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Frontend-Bundle bauen
        # nginx mountet ./frontend/dist als Host-Bind-Mount (docker-compose.prod-with-proxy.yml).
        # Der Dockerfile-prod-Builder erzeugt dist nur im Image-Kontext, nicht auf dem Host.
        # Daher muss der Bundle-Build hier explizit auf dem Runner laufen.
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: CI-Umgebungsdatei generieren
        run: |
          printf 'VITE_AGORA_TOKEN=%s\nAGORA_AUTH_TOKEN=%s\nNEO4J_PASSWORD=%s\nSECRET_KEY=%s\nLLM_API_KEY=%s\nAGORA_DEBUG=false\nAGORA_BIND_HOST=0.0.0.0\n' \
            "$VITE_AGORA_TOKEN" "$AGORA_AUTH_TOKEN" "$NEO4J_PASSWORD" "$SECRET_KEY" "$LLM_API_KEY" > .env

      - name: Compose-Stack starten
        # ALLOW_BUILD_TIME_TOKEN=true: CI ist Single-User-Tailnet-Variante,
        # Token-Bundle-Einbrennen ist in diesem Kontext zulässig (N6/F2.1).
        # AGORA_BIND_HOST=0.0.0.0: Backend muss auf allen Interfaces erreichbar
        # sein, damit der nginx-Sidecar agora:5001 im Compose-Netz erreicht.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f deploy/compose/docker-compose.prod-with-proxy.yml \
            up -d --build

      - name: Auf Proxy-Health warten
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/healthz; then
              echo "Proxy bereit"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Healthz-Timeout nach 5 Minuten"
              docker compose ps -a
              docker compose logs --tail=200
              docker inspect agora-nginx 2>/dev/null || true
              docker inspect agora 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Verify-Skript ausfuehren
        run: bash scripts/verify-deploy.sh

      - name: Logs sammeln (immer)
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
          docker inspect agora-nginx 2>/dev/null || true
          docker inspect agora 2>/dev/null || true

      - name: Stack abraeumen
        if: always()
        run: docker compose down -v
