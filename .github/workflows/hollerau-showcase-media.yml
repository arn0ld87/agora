name: Build Hollerau showcase media

on:
  push:
    branches:
      - docs/hollerau-showcase-run
    paths:
      - .github/workflows/hollerau-showcase-media.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/hollerau-showcase-run
          fetch-depth: 0

      - name: Install media helpers
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Fetch processed showcase transport assets
        run: |
          curl -L --fail --retry 3 -o /tmp/agora-demo-poster.jpg 'https://at.adobe.com/NWGMtfz2waI2oxmS'
          curl -L --fail --retry 3 -o /tmp/video-sprite.jpg 'https://at.adobe.com/TlFKwTbcFfzCXM1T'
          file /tmp/agora-demo-poster.jpg /tmp/video-sprite.jpg

      - name: Reconstruct edited demo
        run: |
          mkdir -p /tmp/showcase-frames
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          sheet = Image.open("/tmp/video-sprite.jpg").convert("RGB")
          cols, rows = 16, 11
          cell_w, cell_h = 320, 162
          total = 166
          out = Path("/tmp/showcase-frames")
          for i in range(total):
              x = (i % cols) * cell_w
              y = (i // cols) * cell_h
              frame = sheet.crop((x, y, x + cell_w, y + cell_h))
              frame.save(out / f"f{i+1:04d}.jpg", quality=90)
          PY

          ffmpeg -y -loglevel error             -framerate 4 -i /tmp/showcase-frames/f%04d.jpg             -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p             -vf "scale=800:-2:flags=lanczos" -movflags +faststart             media/agora-demo.mp4

          cp /tmp/agora-demo-poster.jpg media/agora-demo-poster.jpg

      - name: Verify output
        run: |
          test -s media/agora-demo-poster.jpg
          test -s media/agora-demo.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 media/agora-demo.mp4

      - name: Commit media and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/agora-demo-poster.jpg media/agora-demo.mp4
          git rm .github/workflows/hollerau-showcase-media.yml
          git commit -m "docs: replace showcase media"
          git push origin HEAD:docs/hollerau-showcase-run
