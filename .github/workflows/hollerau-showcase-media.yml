name: Build Hollerau showcase media

on:
  push:
    branches:
      - docs/hollerau-showcase-run
    paths:
      - .github/workflows/hollerau-showcase-media.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/hollerau-showcase-run
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install capture tooling
        run: |
          mkdir -p /tmp/agora-showcase-tools
          cd /tmp/agora-showcase-tools
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check pillow

      - name: Capture clean Agora views
        run: |
          cat > /tmp/capture-showcase.cjs <<'NODE'
          const fs = require("fs");
          const { chromium } = require("/tmp/agora-showcase-tools/node_modules/playwright");

          const out = "/tmp/agora-showcase";
          fs.mkdirSync(out, { recursive: true });

          const routes = [
            ["graph", "https://agora.alexle135.de/v4/graph-build/proj_43cc7be1da58?maxRounds=10"],
            ["simulation", "https://agora.alexle135.de/v4/simulation/sim_8fd9a6e4bc97?projectId=sim_8fd9a6e4bc97&maxRounds=24&simulationDays=1"],
            ["feed", "https://agora.alexle135.de/v4/simulation/sim_8fd9a6e4bc97/feed?projectId=sim_8fd9a6e4bc97&maxRounds=24&simulationDays=1"],
            ["report", "https://agora.alexle135.de/v4/report/new?simulationId=sim_8fd9a6e4bc97&runId=run_31024c64f840"],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1600, height: 900 },
              recordVideo: { dir: out, size: { width: 1600, height: 900 } },
            });
            const page = await context.newPage();
            const video = page.video();

            for (const [name, url] of routes) {
              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              await page.waitForTimeout(5000);
              await page.locator("text=Agora").first().waitFor({ state: "visible", timeout: 15000 });
              await page.addStyleTag({
                content: "html,body{scrollbar-width:none!important}::-webkit-scrollbar{display:none!important}"
              });
              await page.evaluate(() => window.scrollTo(0, 0));
              await page.waitForTimeout(500);
              await page.screenshot({ path: `${out}/${name}.png`, fullPage: false });

              const height = await page.evaluate(() =>
                Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)
              );
              const maxY = Math.max(0, height - 900);
              const steps = Math.min(6, Math.max(1, Math.ceil(maxY / 500)));
              for (let i = 1; i <= steps; i++) {
                const y = Math.round((maxY * i) / steps);
                await page.evaluate((scrollY) => window.scrollTo({ top: scrollY, behavior: "smooth" }), y);
                await page.waitForTimeout(450);
              }
              await page.waitForTimeout(1200);
            }

            await context.close();
            await browser.close();
            const recorded = await video.path();
            fs.copyFileSync(recorded, `${out}/capture.webm`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node /tmp/capture-showcase.cjs

      - name: Build poster and edited video
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          src = Path("/tmp/agora-showcase")
          files = [
              ("Graph Build", src / "graph.png"),
              ("Simulation", src / "simulation.png"),
              ("Live-Feed", src / "feed.png"),
              ("Bericht", src / "report.png"),
          ]
          canvas = Image.new("RGB", (1600, 960), (12, 11, 10))
          draw = ImageDraw.Draw(canvas)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 28)
          except OSError:
              font = ImageFont.load_default()

          positions = [(24, 24), (812, 24), (24, 492), (812, 492)]
          cell = (764, 420)
          for (label, path), (x, y) in zip(files, positions):
              im = Image.open(path).convert("RGB")
              im = ImageOps.fit(im, cell, method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              canvas.paste(im, (x, y + 40))
              draw.text((x, y), label, font=font, fill=(236, 231, 225))
          canvas.save("media/agora-demo-poster.jpg", quality=86, optimize=True, progressive=True)
          PY

          ffmpeg -y -i /tmp/agora-showcase/capture.webm             -an -vf "setpts=PTS/1.15,fps=18,scale=1280:-2:flags=lanczos"             -c:v libx264 -preset slow -crf 29 -pix_fmt yuv420p -movflags +faststart             media/agora-demo.mp4

      - name: Commit refreshed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/agora-demo-poster.jpg media/agora-demo.mp4
          git commit -m "docs: refresh Hollerau showcase media"
          git push origin HEAD:docs/hollerau-showcase-run
