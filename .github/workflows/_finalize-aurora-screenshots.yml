name: Finalize AURORA screenshots

on:
  push:
    branches:
      - docs/fix-aurora-reference-run-1305

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-aurora-reference-run-1305
      - name: Convert original pixel crops to README JPEGs
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('docs/assets/screenshots/reference-runs/2026-08-14-aurora')
          for src, dst in [
              (root / '01-evidence-inspector.webp', root / '01-evidence-inspector.jpg'),
              (root / '02-agent-interviews.webp', root / '02-agent-interviews.jpg'),
          ]:
              Image.open(src).convert('RGB').save(dst, 'JPEG', quality=88, optimize=True, progressive=True)
          PY
      - name: Commit converted crops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/screenshots/reference-runs/2026-08-14-aurora/*.jpg
          git commit -m 'docs: replace AURORA screenshots with readable original crops'
          git push origin HEAD:docs/fix-aurora-reference-run-1305
