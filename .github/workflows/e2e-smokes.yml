name: e2e-smokes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

# Veraltete PR-Laeufe abbrechen, sobald ein neuer Commit gepusht wird.
# push:main, schedule und workflow_dispatch bleiben unangetastet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI-Welle 2026-10-02: Reine Doku-PRs (nur docs/, changelog.d/ oder Root-
  # *.md) brauchen keinen Docker-Stack-Boot. Weder Dockerfile noch
  # Frontend/Backend lesen docs/ oder Root-Markdown zur Build- oder Laufzeit
  # — ein Skip veraendert also kein getestetes Verhalten.
  #
  # `if`-Skip auf dem Playwright-Job statt Workflow-Level `paths`: ein per
  # `paths` nie gestarteter Workflow meldet gar keinen Status fuer seine
  # Required Checks und haelt den PR auf "Expected — Waiting for status to be
  # reported" fest. Ein per `if` uebersprungener Job meldet laut GitHub-Doku
  # Success und erfuellt den Required Check mit unveraendertem `name:`.
  #
  # Fail-open: schlaegt dieser Job fehl (z. B. Diff nicht ermittelbar), bleibt
  # `docs_only` leer/false und der E2E-Smoke laeuft regulaer — ein Fehler hier
  # darf nie heimlich Tests ausblenden.
  changes:
    name: E2E-Relevanz ermitteln
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Nur-Doku-PR erkennen
        id: docs-only
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docs_only=false
          if files=$(git diff --no-renames --name-only HEAD^1 HEAD) && [[ -n "$files" ]]; then
            allowed_regex='^(docs/|changelog\.d/|[^/]+\.md$)'
            if grep -qvE "$allowed_regex" <<<"$files"; then
              docs_only=false
            else
              docs_only=true
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  e2e-smoke:
    name: Playwright E2E-Smokes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    env:
      AGORA_PROXY_PORT: '80'
      AGORA_E2E_BASE_URL: http://127.0.0.1:80
      AGORA_SKIP_EMBEDDING_PROBE: 'true'
      AGORA_E2E_LLM_MODE: 'stub'
      AGORA_E2E_PREBUILT: '1'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            claude.ai:443
            azure.archive.ubuntu.com:80
            cdn.playwright.dev:443
            dl-cdn.alpinelinux.org:443
            dl-4.alpinelinux.org:443
            deb.debian.org:80
            deb.debian.org:443
            dl.google.com:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            esm.ubuntu.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            downloads.claude.ai:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            packages.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            playwright.azureedge.net:443
            playwright-akamai.azureedge.net:443
            playwright-verizon.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Generate ephemeral E2E credentials
        run: |
          {
            echo "AGORA_AUTH_TOKEN=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "NEO4J_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - name: E2E-Images vorbauen (Bake + GHA-Cache)
        uses: ./.github/actions/e2e-prebuild
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build
      - name: Install Playwright browsers (Chromium-only, with cache)
        uses: ./.github/actions/setup-playwright-chromium
      - name: Run Playwright E2E-Smokes
        working-directory: frontend
        run: npx playwright test --reporter=list,github
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 14
