            pkg-containers.githubusercontent.com:443
            playwright.azureedge.net:443
            playwright-akamai.azureedge.net:443
            playwright-verizon.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Generate ephemeral E2E credentials
        # Gleiche Credential-Generierung wie im health-smoke Job. Wird zum
        # Seeden der Provider-Connections (mock-models) in global-setup.ts
        # gebraucht (AGORA_AUTH_TOKEN als X-Agora-Token-Header).
        run: |
          {
            echo "AGORA_AUTH_TOKEN=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "NEO4J_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build
      - name: Install Playwright browsers (Chromium-only, with cache)
        # Issue #1070: apt-get fuer Playwright-deps lief am 2026-08-04
        # auf Microsoft-/Chrome-Repos in den 8-min-Step-Timeout; der
        # Job brach ab, bevor Chromium ueberhaupt geladen war.
        # Composite-Action cacht ~/.cache/ms-playwright ueber
        # actions/cache@v4; Cold-Install verträgt 15 min,
        # Warm-Cache faellt auf apt-deps unter 60 s zurueck.
        uses: ./.github/actions/setup-playwright-chromium
      - name: Run Playwright AiModelPicker-Smoke
        working-directory: frontend
        run: npx playwright test ai-model-picker.spec.ts --reporter=list,github
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-trace-ai-model-picker
          path: frontend/test-results/
          retention-days: 14

  # Issue #978: run-budget.spec.ts wurde mit PR #975 (Issue #764) eingefuehrt,
  # lief aber in KEINEM Workflow — der erste Lauf ueberhaupt fand im CI-/E2E-Audit
  # vom 2026-07-31 statt und deckte sofort zwei Defekte auf. Ein Budget-Smoke, der
  # nie laeuft, ist keine Kostenkontrolle, sondern nur deren Behauptung.
  #
  # Der Job-`name:` ist BEWUSST (noch) KEIN Required Check. Erst nachdem er ueber
  # mehrere Laeufe stabil gruen war, wird er in die Branch Protection aufgenommen —
  # sonst blockiert ein frisch verdrahteter, noch unerprobter E2E-Job jeden PR.
  # Beim Aufnehmen den `name:` NICHT aendern, sonst bricht die Zuordnung.
  run-budget-smoke:
    name: Playwright Run-Budget-Smoke (Issue #764 / #978)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGORA_PROXY_PORT: '80'
      AGORA_E2E_BASE_URL: http://127.0.0.1:80
      # Embedding-Probe wie im health-smoke überspringen (Issue #276)
      AGORA_SKIP_EMBEDDING_PROBE: 'true'
      # LLM-Stub statt echter Provider: der Budgetabbruch muss deterministisch
      # und ohne kostenpflichtige Calls ausgeloest werden. e2e-up.sh appendet
      # diesen Wert in die Container-Env (Job-Level-env allein reicht nicht).
      AGORA_E2E_LLM_MODE: 'stub'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            azure.archive.ubuntu.com:80
            cdn.playwright.dev:443
            dl-cdn.alpinelinux.org:443
            dl-4.alpinelinux.org:443
            deb.debian.org:80
            deb.debian.org:443
            dl.google.com:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            esm.ubuntu.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            packages.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            playwright.azureedge.net:443
            playwright-akamai.azureedge.net:443
            playwright-verizon.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            production.cloudflare.docker.com:443
