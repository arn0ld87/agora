        uses: ./.github/actions/setup-playwright-chromium
      - name: Run Playwright Golden-Gate-Accessibility-Smoke
        working-directory: frontend
        # drawer-focus-trap.spec.ts laeuft hier mit, NICHT in einem eigenen Job:
