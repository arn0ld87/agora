    timeout-minutes: 30
    env:
      AGORA_PROXY_PORT: '80'
      AGORA_E2E_BASE_URL: http://127.0.0.1:80
      AGORA_SKIP_EMBEDDING_PROBE: 'true'
      # Stub-Modus: deterministisch für alle drei Modi (strict/balanced/explorative)
      AGORA_E2E_LLM_MODE: 'stub'
    steps:
      - name: Harden Runner
