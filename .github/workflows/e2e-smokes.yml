name: e2e-smokes

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  health-smoke:
    name: Playwright Health-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGORA_PROXY_PORT: '80'
      AGORA_E2E_BASE_URL: http://127.0.0.1:80
      # Ollama läuft nicht im CI-Stack — Backend macht beim Boot eine
      # Embedding-Probe gegen localhost:11434, die ohne Ollama scheitert
      # und den Worker mit RuntimeError("Embedding configuration invalid")
      # killt. Gleiches Skip-Pattern wie docker-image.yml::prod-proxy-smoke
      # (Issue #276): nur die statische KNOWN_EMBEDDING_DIMS-Validation
      # läuft, der Live-HTTP-Probe-Call entfällt.
      AGORA_SKIP_EMBEDDING_PROBE: 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            azure.archive.ubuntu.com:80
            cdn.playwright.dev:443
            deb.debian.org:80
            deb.debian.org:443
            dl.google.com:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            packages.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            playwright.azureedge.net:443
            playwright-akamai.azureedge.net:443
            playwright-verizon.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate ephemeral E2E credentials
        # Werte werden zur Runtime generiert, NICHT als Strings in der Datei
        # gehalten — sonst triggert GitGuardian / Gitleaks bei jedem PR.
        # Reichen für die Smoke-Tests aus, da der Compose-Stack mit denselben
        # Werten gestartet wird (Backend liest AGORA_AUTH_TOKEN aus dem env).
        run: |
          {
            echo "AGORA_AUTH_TOKEN=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "NEO4J_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend bundle
        # nginx-Sidecar mountet frontend/dist als statisches Volume
        # (deploy/compose/docker-compose.prod-with-proxy.yml). Ohne Build
        # ist der Mount leer und nginx antwortet 403 Forbidden auf GET /
        # — das schlug in Health-Smoke Test 3 als Page-Title durch.
        working-directory: frontend
        run: bun run build
      - name: Install Playwright browsers (Chromium-only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Health-Smoke
        working-directory: frontend
        run: npx playwright test health.spec.ts --reporter=list,github
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 14

  upload-graph-smoke:
    name: Playwright Upload+Graph-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGORA_PROXY_PORT: '80'
      AGORA_E2E_BASE_URL: http://127.0.0.1:80
      # Embedding-Probe wie im health-smoke überspringen (Issue #276)
      AGORA_SKIP_EMBEDDING_PROBE: 'true'
      # LLM-Stub: OntologyGenerator + NERExtractor liefern deterministisch
      # ohne Ollama. Aktiviert ausschließlich via Env-Var — Prod-Verhalten
      # bleibt unverändert (backend/app/utils/llm_e2e_stub.py + llm_client.py:386).
      AGORA_E2E_LLM_MODE: 'stub'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            azure.archive.ubuntu.com:80
            cdn.playwright.dev:443
            deb.debian.org:80
            deb.debian.org:443
            dl.google.com:443
            docker-images-prod.s3.amazonaws.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            packages.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            playwright.azureedge.net:443
            playwright-akamai.azureedge.net:443
            playwright-verizon.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate ephemeral E2E credentials
        # Gleiche Credential-Generierung wie im health-smoke Job.
        # AGORA_E2E_LLM_MODE wird über Job-Level-env gesetzt, NICHT hier.
        run: |
          {
            echo "AGORA_AUTH_TOKEN=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "NEO4J_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build
      - name: Install Playwright browsers (Chromium-only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Upload+Graph-Smoke
        working-directory: frontend
        run: npx playwright test upload-graph.spec.ts --reporter=list,github
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace-upload-graph
          path: frontend/test-results/
          retention-days: 14

  minimal-report-smoke:
    name: Playwright Minimalreport-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGORA_PROXY_PORT: '80'
      AGORA_E2E_BASE_URL: http://127.0.0.1:80
      # Embedding-Probe wie im health-smoke überspringen (Issue #276)
      AGORA_SKIP_EMBEDDING_PROBE: 'true'
      # LLM-Stub: plan_outline + generate_section_react + tool-execution
      # laufen deterministisch ohne Ollama. Aktiviert ausschließlich via
      # Env-Var — Prod-Verhalten bleibt unverändert.
      # Stub-Vertrag:
      #   chat_json(PlanResponse)  → _stub_plan_response() → 11 Sections
      #   chat()                   → e2e_stub_chat_response() → Tool-Calls + Final Answer
      #   (backend/app/utils/llm_e2e_stub.py + llm_client.py)
      AGORA_E2E_LLM_MODE: 'stub'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
