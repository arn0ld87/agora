name: refactor-python-oasis-split

on:
  push:
    branches:
      - claude/refactor-python-hotspots

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: dummy-ci-key
      FLASK_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/refactor-python-hotspots
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Repair pre-existing Python syntax error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/simulation_config_generator.py')
          text = path.read_text(encoding='utf-8')
          old = 'except json.JSONDecodeError, ValueError:'
          new = 'except (json.JSONDecodeError, ValueError):'
          if old not in text:
              raise SystemExit('expected pre-existing syntax error not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile backend/app/services/simulation_config_generator.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/simulation_config_generator.py
          git commit -m 'fix(config): repair invalid exception tuple syntax'

      - name: Split OasisProfileGenerator by responsibility
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import builtins
          import copy
          import io
          import re
          import textwrap
          import tokenize
          from pathlib import Path

          path = Path('backend/app/services/oasis_profile_generator.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          tree = ast.parse(source)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == 'OasisProfileGenerator'
          )
          methods = {
              node.name: node
              for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          groups = {
              'oasis_profile_core.py': (
                  '_oasis_profile_core',
                  ['generate_profile_from_entity', '_generate_username'],
              ),
              'oasis_profile_demographics.py': (
                  '_oasis_profile_demographics',
                  [
                      '_pick_dach_name', '_last_name', '_pick_individual_gender',
                      '_largest_remainder_counts', '_build_weighted_slots',
                      '_build_age_slots', '_build_demographic_slots',
                      '_build_demographic_slot_prompt_block',
                  ],
              ),
              'oasis_profile_context.py': (
                  '_oasis_profile_context',
                  [
                      '_search_graph_for_entity', '_build_entity_context',
                      '_align_persona_identity', '_profession_after_coherence_check',
                      '_is_individual_entity', '_is_group_entity',
                      '_build_eligibility_prompt_block',
                  ],
              ),
              'oasis_profile_llm.py': (
                  '_oasis_profile_llm',
                  ['_generate_profile_with_llm', '_validate_profile_metadata', '_try_fix_json'],
              ),
              'oasis_profile_prompts.py': (
                  '_oasis_profile_prompts',
                  ['_get_system_prompt', '_build_individual_persona_prompt', '_build_group_persona_prompt'],
              ),
              'oasis_profile_rule_based.py': (
                  '_oasis_profile_rule_based',
                  [
                      '_rule_based_voice_register', '_report_persona_degradation',
                      '_generate_profile_rule_based', '_build_collective_payload',
                      '_build_rule_based_payload', '_build_generic_person_payload',
                  ],
              ),
              'oasis_profile_batch_results.py': (
                  '_oasis_profile_batch_results',
                  [
                      '_backfill_rejected_slots', '_consume_gevent_results',
                      '_consume_thread_results', '_cancel_checkpoint',
                  ],
              ),
              'oasis_profile_batch.py': (
                  '_oasis_profile_batch',
                  ['generate_profiles_from_entities'],
              ),
              'oasis_profile_persistence.py': (
                  '_oasis_profile_persistence',
                  [
                      '_print_generated_profile', 'save_profiles', '_save_twitter_csv',
                      '_normalize_gender', '_save_reddit_json', 'save_profiles_to_json',
                  ],
              ),
          }

          expected = {name for _filename, (_alias, names) in groups.items() for name in names}
          missing = sorted(expected - methods.keys())
          if missing:
              raise SystemExit(f'missing methods: {missing}')

          builtin_names = set(dir(builtins)) | {'self', 'cls'}
          dynamic_names = {'logger', '_resolve_persona_detail_level', '_try_repair_truncated_json'}

          def start_line(node: ast.AST) -> int:
              decorators = getattr(node, 'decorator_list', [])
              return min([node.lineno, *[dec.lineno for dec in decorators]])

          def local_names(node: ast.AST) -> set[str]:
              result: set[str] = set()
              args = node.args
              for arg in [*args.posonlyargs, *args.args, *args.kwonlyargs]:
                  result.add(arg.arg)
              if args.vararg:
                  result.add(args.vararg.arg)
              if args.kwarg:
                  result.add(args.kwarg.arg)
              for child in ast.walk(node):
                  if isinstance(child, ast.Name) and isinstance(child.ctx, (ast.Store, ast.Del)):
                      result.add(child.id)
                  elif isinstance(child, (ast.Import, ast.ImportFrom)):
                      for alias in child.names:
                          result.add(alias.asname or alias.name.split('.')[0])
                  elif isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and child is not node:
                      result.add(child.name)
                  elif isinstance(child, ast.ExceptHandler) and child.name:
                      result.add(child.name)
              return result

          def global_names(nodes: list[ast.AST]) -> set[str]:
              loads: set[str] = set()
              locals_: set[str] = set()
              for node in nodes:
                  locals_.update(local_names(node))
                  for child in ast.walk(node):
                      if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Load):
                          loads.add(child.id)
              return loads - locals_ - builtin_names

          def rewrite_dynamic_names(text: str) -> str:
              toks = []
              for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                  if tok.type == tokenize.NAME and tok.string in dynamic_names:
                      toks.extend([
                          (tokenize.NAME, '_legacy'),
                          (tokenize.OP, '.'),
                          (tokenize.NAME, tok.string),
                      ])
                  else:
                      toks.append((tok.type, tok.string))
              return tokenize.untokenize(toks)

          def helper_source(node: ast.AST) -> str:
              start = start_line(node)
              raw = ''.join(lines[start - 1: node.end_lineno])
              raw = textwrap.dedent(raw)
              raw = rewrite_dynamic_names(raw)
              first_arg = None
              if node.args.posonlyargs or node.args.args:
                  first_arg = (node.args.posonlyargs + node.args.args)[0].arg
              if first_arg in {'self', 'cls'}:
                  pattern = rf'((?:async\s+)?def\s+{re.escape(node.name)}\s*\(\s*){first_arg}(?=\s*[,\)])'
                  raw, count = re.subn(pattern, rf'\1{first_arg}: Any', raw, count=1, flags=re.S)
                  if count != 1:
                      raise SystemExit(f'could not annotate first arg for {node.name}')
              return raw.rstrip() + '\n'

          def wrapper_source(node: ast.AST, module_alias: str) -> str:
              replacement = copy.deepcopy(node)
              positional = [*node.args.posonlyargs, *node.args.args]
              call_args: list[ast.expr] = [ast.Name(id=arg.arg, ctx=ast.Load()) for arg in positional]
              if node.args.vararg:
                  call_args.append(
                      ast.Starred(value=ast.Name(id=node.args.vararg.arg, ctx=ast.Load()), ctx=ast.Load())
                  )
              call_keywords: list[ast.keyword] = [
                  ast.keyword(arg=arg.arg, value=ast.Name(id=arg.arg, ctx=ast.Load()))
                  for arg in node.args.kwonlyargs
              ]
              if node.args.kwarg:
                  call_keywords.append(
                      ast.keyword(arg=None, value=ast.Name(id=node.args.kwarg.arg, ctx=ast.Load()))
                  )
              call = ast.Call(
                  func=ast.Attribute(
                      value=ast.Name(id=module_alias, ctx=ast.Load()),
                      attr=node.name,
                      ctx=ast.Load(),
                  ),
                  args=call_args,
                  keywords=call_keywords,
              )
              doc = None
              if node.body and isinstance(node.body[0], ast.Expr):
                  value = node.body[0].value
                  if isinstance(value, ast.Constant) and isinstance(value.value, str):
                      doc = copy.deepcopy(node.body[0])
              body: list[ast.stmt] = []
              if doc is not None:
                  body.append(doc)
              if isinstance(node, ast.AsyncFunctionDef):
                  body.append(ast.Return(value=ast.Await(value=call)))
              else:
                  body.append(ast.Return(value=call))
              replacement.body = body
              ast.fix_missing_locations(replacement)
              return textwrap.indent(ast.unparse(replacement), '    ') + '\n'

          replacements: dict[int, tuple[int, str]] = {}
          imports_for_original: list[str] = []
          service_dir = path.parent

          for filename, (module_alias, names) in groups.items():
              nodes = [methods[name] for name in names]
              deps = sorted(global_names(nodes) - dynamic_names)
              if 'OasisProfileGenerator' in deps:
                  raise SystemExit(f'{filename} unexpectedly depends on OasisProfileGenerator before definition')

              helper_parts = [
                  'from __future__ import annotations\n\n',
                  'from typing import Any\n\n',
                  'from . import oasis_profile_generator as _legacy\n',
              ]
              if deps:
                  helper_parts.append('from .oasis_profile_generator import (\n')
                  helper_parts.extend(f'    {name},\n' for name in deps)
                  helper_parts.append(')\n')
              helper_parts.append('\n')
              for node in nodes:
                  helper_parts.append(helper_source(node))
                  helper_parts.append('\n\n')
              (service_dir / filename).write_text(''.join(helper_parts).rstrip() + '\n', encoding='utf-8')

              imports_for_original.append(f'from . import {filename[:-3]} as {module_alias}\n')
              for node in nodes:
                  replacements[start_line(node)] = (node.end_lineno, wrapper_source(node, module_alias))

          out: list[str] = []
          line_no = 1
          while line_no <= len(lines):
              if line_no == cls.lineno:
                  out.append('\n')
                  out.extend(imports_for_original)
                  out.append('\n')
              if line_no in replacements:
                  end, replacement = replacements[line_no]
                  out.append(replacement)
                  line_no = end + 1
                  continue
              out.append(lines[line_no - 1])
              line_no += 1

          path.write_text(''.join(out), encoding='utf-8')

          # Structural sanity checks: public class remains where callers import it,
          # every extracted method remains reachable on the class, and the source shrinks materially.
          new_source = path.read_text(encoding='utf-8')
          if 'class OasisProfileGenerator:' not in new_source:
              raise SystemExit('public OasisProfileGenerator class disappeared')
          if len(new_source.splitlines()) >= 900:
              raise SystemExit(f'oasis_profile_generator.py still too large: {len(new_source.splitlines())} LOC')
          PY

          python -m py_compile backend/app/services/oasis_profile_generator.py backend/app/services/oasis_profile_*.py
          echo "LOC after split:"
          wc -l backend/app/services/oasis_profile_generator.py backend/app/services/oasis_profile_*.py | sort -nr

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Ruff targeted Python slice
        working-directory: backend
        run: uv run ruff check app/services/oasis_profile_generator.py app/services/oasis_profile_*.py

      - name: Mypy targeted Python slice
        working-directory: backend
        run: uv run mypy app/services/oasis_profile_generator.py app/services/oasis_profile_*.py

      - name: Run Oasis regression tests
        working-directory: backend
        run: >-
          uv run pytest -q
          tests/test_oasis_profile_generator.py
          tests/test_oasis_profile_format.py
          tests/services/test_oasis_voice_register.py
          tests/services/test_persona_eligibility_typeless.py
          tests/services/test_sim_prep_key_routing.py
          tests/services/test_persona_quota_wiring.py

      - name: Commit verified Python-only split and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/refactor-python-ast-map.yml
          rm -f .github/workflows/refactor-python-oasis-split.yml
          git diff --check
          git add -A
          git commit -m 'refactor(persona): split oasis profile generator by responsibility'
          git push origin HEAD:claude/refactor-python-hotspots
