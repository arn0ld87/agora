name: refactor-python-oasis-v2

on:
  push:
    branches:
      - claude/refactor-python-hotspots

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LLM_API_KEY: dummy-ci-key
      FLASK_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/refactor-python-hotspots
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Generate responsibility split
        run: |
          python backend/scripts/_tmp_refactor_oasis.py
          python backend/scripts/_tmp_fix_oasis_generated.py
          python -m py_compile \
            backend/app/services/oasis_profile_generator.py \
            backend/app/services/oasis_profile_*.py \
            backend/app/services/simulation_config_generator.py
          echo '--- LOC after split ---'
          wc -l backend/app/services/oasis_profile_generator.py backend/app/services/oasis_profile_*.py | sort -nr

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Remove scanner-generated false helper imports
        working-directory: backend
        shell: bash
        run: |
          helpers="$(find app/services -maxdepth 1 -name 'oasis_profile_*.py' \
            ! -name 'oasis_profile_generator.py' \
            ! -name 'oasis_profile_models.py' -print)"
          uv run ruff check --fix $helpers app/services/oasis_profile_models.py || true

      - name: Rewire helpers to direct dependencies
        run: |
          python backend/scripts/_tmp_rewire_oasis_imports.py
          python -m py_compile backend/app/services/oasis_profile_generator.py backend/app/services/oasis_profile_*.py

      - name: Ruff targeted slice
        working-directory: backend
        run: |
          uv run ruff check --fix app/services/oasis_profile_generator.py app/services/oasis_profile_*.py app/services/simulation_config_generator.py
          uv run ruff check app/services/oasis_profile_generator.py app/services/oasis_profile_*.py app/services/simulation_config_generator.py

      - name: Compile after rewiring and formatting
        run: python -m py_compile backend/app/services/oasis_profile_generator.py backend/app/services/oasis_profile_*.py backend/app/services/simulation_config_generator.py

      - name: Mypy targeted slice
        working-directory: backend
        run: uv run mypy app/services/oasis_profile_*.py app/services/simulation_config_generator.py

      - name: Run persona regression suite
        working-directory: backend
        run: |
          uv run pytest -q \
            tests/test_oasis_profile_generator.py \
            tests/test_oasis_profile_format.py \
            tests/services/test_oasis_voice_register.py \
            tests/services/test_persona_eligibility_typeless.py \
            tests/services/test_sim_prep_key_routing.py \
            tests/services/test_persona_quota_wiring.py

      - name: Verify Python-only final diff
        run: |
          rm backend/scripts/_tmp_refactor_oasis.py
          rm backend/scripts/_tmp_fix_oasis_generated.py
          rm backend/scripts/_tmp_rewire_oasis_imports.py
          rm .github/workflows/refactor-python-oasis-v2.yml
          git diff --check origin/main --
          changed="$(git diff --name-only origin/main --)"
          bad="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -vE '\.py$' || true)"
          if [ -n "$bad" ]; then
            echo 'Non-Python files would remain in final diff:'
            echo "$bad"
            exit 1
          fi
          echo 'Final net diff contains only Python files:'
          printf '%s\n' "$changed"

      - name: Commit verified Python refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(persona): split oasis profile generator by responsibility'
          git push origin HEAD:claude/refactor-python-hotspots
