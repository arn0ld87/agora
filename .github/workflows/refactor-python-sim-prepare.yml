name: refactor-python-sim-prepare-red

on:
  push:
    branches:
      - claude/refactor-python-hotspots

permissions:
  contents: read

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_API_KEY: dummy-ci-key
      FLASK_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/refactor-python-hotspots
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Boundary test must fail before implementation
        working-directory: backend
        run: uv run pytest -q tests/api/test_simulation_prepare_module_boundaries.py
