name: refactor-finalize-audit

on:
  push:
    branches:
      - claude/refactor-repo-loc-audit

permissions:
  contents: write

jobs:
  finalize-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/refactor-repo-loc-audit
      - name: Finalize canonical refactor audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/refactor/loc-audit.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Status: Vorher-Zustand vor dem ersten Refactoring-Slice',
              'Status: Abschlussstand nach zwei verhaltensneutralen Refactoring-Slices',
              1,
          )

          start = text.index('## Messmethode und Einschraenkung')
          end = text.index('## Ausschluesse', start)
          measurement = '''## Messmethode\n\nDer erste Screening-Durchlauf lief ueber den GitHub-Connector. Fuer den Abschlussstand wurde das Inventar anschliessend in GitHub Actions reproduzierbar ueber `git ls-files` erzeugt. Gezaehlt werden logische Textzeilen (`splitlines()`) fuer alle getrackten `.py`, `.ts`, `.tsx`, `.vue`, `.js` und `.sh`-Dateien. Tests werden separat klassifiziert; `design/`, Vendor-/Build-/Dist-Verzeichnisse und eindeutig generierte Dateien sind ausgeschlossen.\n\nDie vollstaendigen Rohdaten stehen in `docs/refactor/loc-inventory.tsv`, die menschenlesbare Rangliste in `docs/refactor/loc-inventory.md`. Damit sind die frueheren Schwellenproben durch exakte Repo-Zahlen ersetzt.\n\nAktueller Abschlussstand: **633 Produktionsdateien**, **755 Testdateien**, davon im Produktionscode **23 P0**, **49 P1**, **57 P2** und **75 P3**.\n\n'''
          text = text[:start] + measurement + text[end:]

          if '## Abschlussentscheidung fuer aktuelle P0-Hotspots' not in text:
              text += '''\n\n## Abschlussentscheidung fuer aktuelle P0-Hotspots\n\nLOC bleibt ein Screening-Signal, kein Selbstzweck. Ein P0 wird in diesem PR nur dann geteilt, wenn die Verantwortung sauber abgrenzbar ist und bestehende Contract-/Semantik-Gates die Verschiebung ohne Parallelumbau absichern.\n\n| Datei | LOC nach Slices | Entscheidung in diesem PR | Begruendung / naechste saubere Grenze |\n|---|---:|---|---|\n| `backend/app/services/oasis_profile_generator.py` | 2792 | spaeter | Provider-, Fallback- und Persona-Semantik stark gekoppelt; zuerst reine Mapping-/Normalisierungshelfer separat charakterisieren. |\n| `backend/scripts/run_parallel_simulation.py` | 2564 | spaeter | eigenstaendiger Runtime-Orchestrator mit Prozess-/IPC-Semantik; eigener Refactor-PR statt Beifang. |\n| `backend/app/services/report_agent/workflow.py` | 2272 | bewusste Stop-Bedingung | Prompt-, Tool- und Evidence-Gate-Semantik; nur mit Characterization-Tests pro Workflow-Phase. |\n| `backend/app/services/report_agent/agent.py` | 1631 | bewusste Stop-Bedingung | zentrale Evidence-/Claim-/Tool-Facade; geschuetzte Evidence-Gates haben Vorrang vor LOC. |\n| `backend/app/llm/client.py` | 1620 | spaeter | Provider-/Secret-/Transport-Semantik; kein mechanischer Split ohne eigene Provider-Regressionen. |\n| `backend/app/services/evidence_entailment.py` | 1496 | bewusste Ausnahme | hochsensible Evidence-Urteile; keine LOC-Kosmetik an semantischen Schwellen. |\n| `backend/app/services/simulation_config_generator.py` | 1390 | naechster geeigneter Slice | deterministische Parser/Normalizer sind abtrennbar, aber nicht mit diesem PR vermischen. |\n| `backend/app/contracts/report_contract.py` | 1318 | bewusste Ausnahme | deklarative Pydantic-SSoT; Split kann Schema-/Zod-Drift statt Wartbarkeit erzeugen. |\n| `backend/app/api/runs.py` | 1316 | **teilweise refactored** | Read-Model extrahiert (-103 LOC). Resume/Restart bleibt vorerst, weil Regressionstests Budget-/Cancel-Semantik sogar per `inspect.getsource` an die Funktion pinnen; eigener Folge-Slice erforderlich. |\n| `backend/scripts/agent_tools.py` | 1307 | spaeter | Simulations-/Agenten-Tooling als Script-Oberflaeche; Use-Sites und CLI-Kompatibilitaet zuerst separat kartieren. |\n| `backend/app/api/simulation_prepare.py` | 1293 | naechster geeigneter Slice | Lock-/Request-/Quota-Helfer sind trennbar; Routing-/Provider-Aufloesung bleibt dabei unveraendert. |\n| `backend/app/services/report_agent/manager.py` | 1269 | spaeter | Report-Persistenz und Lifecycle; Endzustands-/Persistenztests vor Split erforderlich. |\n| `backend/app/api/simulation_run.py` | 1133 | spaeter | Start, Budget, Routing und Manifest-Lifecycle eng gekoppelt; eigener Contract-Slice. |\n| `backend/app/services/prepare_service.py` | 1088 | spaeter | Provider-Aufloesung, Quoten und FSM teilen Semantik; Phasen nur einzeln mit Regressionstests extrahieren. |\n| `frontend/src/components/shell/Dossier.vue` | 1078 | bewusste UI-Ausnahme fuer diesen PR | erheblicher Template-/Style-Anteil; zuerst fachliche Panel-Grenzen statt CSS-Dateiverschiebung. |\n| `backend/scripts/_sim_common.py` | 1022 | spaeter | breit geteilter Runtime-Helfer; Import-/Script-Kompatibilitaet zuerst sichern. |\n| `backend/app/services/sim/process_manager.py` | 1014 | spaeter | Prozess-, Cleanup- und Cancel-Lifecycle; eigener Prozess-Slice. |\n| `backend/app/services/report_agent/evidence.py` | 984 | bewusste Stop-Bedingung | Evidence-Provenance/Degradation geschuetzt; keine semantische Aenderung in einem LOC-PR. |\n| `frontend/src/components/v4/dashboard/HeroNewRun.vue` | 959 | spaeter | UI-State/Flows; Component-/A11y-Schnitt separat. |\n| `backend/app/services/graph_tools.py` | 924 | spaeter | Retrieval und Interviews sind Report-/Evidence-nah; getrennte Tool-Familien erst mit Regressionen. |\n| `frontend/src/components/v4/steps/Step4Report.vue` | 924 | spaeter | Report-UI und Confirm-/Budget-Flows; fachliche Child-Komponenten als eigener Frontend-Slice. |\n| `frontend/src/components/shell/Shelf.vue` | 892 | spaeter | Shell-SFC; erst Script/Template/Style-Verantwortungen separat bewerten. |\n| `frontend/src/components/compare/BranchComparePanel.vue` | 882 | spaeter | Compare-Contract/UI gekoppelt; eigener komponentenbezogener Refactor. |\n\n### In diesem PR abgeschlossen\n\n1. `backend/app/api/runs.py`: Read-only Summary-Enrichment nach `services/run_read_model.py` extrahiert; die zuvor verschobene CC=27-Funktion wurde real zerlegt statt neu allowzulisten.\n2. `backend/app/services/sim/monitor.py`: reine Timeline-/Agent-Statistik nach `sim/run_metrics.py` extrahiert; bestehender `_get_actions`-Monkeypatch-Hook bleibt ueber duenne Wrapper kompatibel. Dadurch faellt `monitor.py` von **893 auf 798 LOC** und damit von P0 auf P1.\n3. Exaktes Repo-Inventar fuer alle geforderten Quelltypen inklusive separater Testliste erzeugt.\n4. Veralteten Radon-Allowlist-Eintrag fuer `_build_run_summary` entfernt und Frontend-SSoT-Kommentar auf das neue Modul aktualisiert.\n\n### Nicht als Erfolg verkauft\n\n`runs.py` bleibt mit **1316 LOC** P0. Der erste Slice reduziert Verantwortungsmischung, loest den God-Controller aber nicht vollstaendig. Die verbleibenden Resume-/Restart-Pfade sind fachlich deutlich riskanter und werden deshalb nicht nur fuer eine schoenere LOC-Zahl verschoben.\n'''

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/refactor-finalize-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/refactor/loc-audit.md
          git commit -m 'docs(refactor): finalize exact LOC audit decisions'
          git push origin HEAD:claude/refactor-repo-loc-audit
