name: 'Setup Playwright Chromium (with cache)'
description: >-
  Install Playwright Chromium browser + system dependencies with cache.
  Restores ~/.cache/ms-playwright from actions/cache so subsequent runs skip
  the ~120MB browser download. Replaces the inline
  ``npx playwright install --with-deps chromium`` step and gives the apt-get
  portion 15 minutes instead of 8.

runs:
  using: 'composite'
  steps:
    - name: Restore Playwright browser cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
        restore-keys: |
          playwright-chromium-${{ runner.os }}-

    - name: Install Playwright Chromium (browser + system deps)
      working-directory: frontend
      # Der apt-Teil von --with-deps zieht Font-Pakete von den Ubuntu-Mirrors.
      # Faellt ein Mirror aus, bricht apt mit Exit 100 ab — nicht in einen
      # Timeout, sondern sofort. Am 2026-08-18 hat das zwei PRs nacheinander
      # rot gemacht ("Could not connect to azure.archive.ubuntu.com:80,
      # connection timed out"), jeweils nach gut einer Minute und bevor ein
      # einziger Test lief. Ein grosszuegigeres Step-Timeout hilft dagegen
      # nicht; das war der Fix fuer #1070 und adressiert einen anderen Fall.
      #
      # Drei Versuche mit wachsender Pause. ``apt-get update`` dazwischen,
      # damit ein zwischenzeitlich rotierter Mirror auch benutzt wird — ohne
      # ihn wiederholt apt denselben unerreichbaren Host. Der
      # Browser-Download ist idempotent und liegt beim zweiten Versuch
      # ohnehin im Cache, ein Retry kostet also fast nichts.
      run: |
        set -u
        for attempt in 1 2 3; do
          if npx playwright install --with-deps chromium; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Playwright-Installation nach 3 Versuchen fehlgeschlagen."
            exit 1
          fi
          delay=$((attempt * 20))
          echo "::warning::Playwright-Installation fehlgeschlagen (Versuch ${attempt}/3) — neuer Versuch in ${delay}s."
          sudo apt-get update || true
          sleep "$delay"
        done
      shell: bash
