services:
  agora:
    # Default-Variante: Dev-Stage aus dem Multi-Stage-Dockerfile (Vite +
    # Flask, Hot-Reload). Für Prod-like-Setups gibt es das explizite
    # Override `docker-compose.prod.yml`, das `target: prod` setzt und
    # gunicorn als WSGI startet. Wer ein vorgebackenes Image (Docker Hub
    # / GHCR) ziehen will, ersetzt den `build`-Block durch
    # `image: alexle135/agora:latest`.
    build:
      context: .
      target: dev
    container_name: agora
    env_file:
      - .env
    # Loopback-Bind: Frontend (Vite) und Backend (Flask) sind im Dev-
    # Default nur lokal erreichbar. Tailscale/LAN-Setups setzen das
    # bewusst über die ENV-Variablen oder einen Reverse-Proxy.
    ports:
      - "127.0.0.1:${AGORA_FRONTEND_PORT:-5173}:5173"
      - "127.0.0.1:${AGORA_BACKEND_PORT:-5001}:5001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /app/backend/logs:size=64M,mode=0700,uid=1000,gid=1000
      - /home/agora/.cache:size=256M,mode=0700,uid=1000,gid=1000
      - /home/agora/.npm:size=64M,mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./backend/uploads:/app/backend/uploads
      # Persist HuggingFace model cache on the external disk so OASIS-pulled
      # models (z. B. Twitter/twhin-bert-base, ~1.1 GB) das 256 MB tmpfs nicht
      # sprengen und beim Container-Restart nicht neu gezogen werden.
      - ./backend/.cache/huggingface:/home/agora/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional: GPU acceleration via NVIDIA Container Toolkit
    # Uncomment the following section if nvidia-container-toolkit is installed
    # and you want Ollama to use GPU acceleration (CUDA).
    # Without this, the container runs in CPU-only mode.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Issue #9 Phase B — event bus transport for Flask↔OASIS IPC.
      # Overrides any REDIS_URL in .env so the bus stays pointed at the
      # compose-private service regardless of host-side defaults.
      - REDIS_URL=redis://redis:6379/0
      # Service discovery for compose-internal Neo4j and host-side Ollama.
      # These overrides win over .env so dev users can keep localhost defaults
      # there for `npm run dev` without breaking the compose workflow.
      - NEO4J_URI=bolt://neo4j:7687
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - EMBEDDING_BASE_URL=http://host.docker.internal:11434
      # Read-only rootfs: don't try to write __pycache__ next to source.
      - PYTHONDONTWRITEBYTECODE=1

  redis:
    image: redis:7-alpine
    container_name: agora-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: agora-neo4j
    # Loopback-Bind: Browser/Bolt nur lokal erreichbar. Container-zu-
    # Container-Verbindungen laufen weiter über das Compose-Netzwerk
    # und brauchen die Host-Ports nicht. Im Prod-Override
    # (`docker-compose.prod.yml`) werden die Ports per `!reset []`
    # komplett rausgenommen.
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt protocol
    environment:
      # :?-Syntax: Compose bricht ab, wenn die Variable fehlt oder leer ist.
      # Kein Default-Passwort mehr — muss bewusst in .env gesetzt werden.
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD muss in .env gesetzt sein}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=4g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
