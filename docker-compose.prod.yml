# Production Compose-Override für Agora.
# Verwendung:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Wesentliche Unterschiede zum Default-Compose:
# - `target: prod` zieht das gunicorn-Runtime-Stage aus dem Multi-Stage-
#   Dockerfile (kein Vite, kein npm zur Laufzeit).
# - Backend-Port wird hier auf 127.0.0.1 gebunden; statisches Frontend
#   wird über einen Reverse-Proxy (nginx/Traefik/Cloudflare-Tunnel)
#   ausgeliefert, nicht direkt aus dem Container.
# - Vite-Frontend-Port (5173) entfällt komplett — `!reset []` über die
#   Default-Liste kippt das aus dem gemergten Compose-Dokument raus.
# - Neo4j-Host-Ports (7474/7687) werden im Prod-Override ebenfalls per
#   `!reset []` deaktiviert. Container-zu-Container-Bolt geht weiter
#   über das Compose-Netzwerk; wer Browser-Zugriff in Prod braucht,
#   tunnelt explizit (Tailscale, SSH-Forward).
# - Persistente Cache-Mounts (HuggingFace) bleiben.
#
# `!reset []` braucht Docker Compose v2.24+. Ältere Compose-Versionen
# fallen back auf array-merge — dann erbt Prod die Loopback-Ports vom
# Default. Das ist nicht ideal, aber kein Sicherheitsbruch (127.0.0.1).

services:
  agora:
    build:
      context: .
      target: prod
    ports: !override
      - "127.0.0.1:${AGORA_BACKEND_PORT:-5001}:5001"
    environment:
      - PYTHONDONTWRITEBYTECODE=1

  neo4j:
    ports: !reset []
