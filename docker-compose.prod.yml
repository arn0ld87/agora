# Production Compose-Override für Agora.
# Verwendung:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Wesentliche Unterschiede zum Default-Compose:
# - `target: prod` zieht das gunicorn-Runtime-Stage aus dem Multi-Stage-
#   Dockerfile (kein Vite, kein npm zur Laufzeit).
# - Backend-Port wird hier auf 127.0.0.1 gebunden; statisches Frontend
#   wird über einen Reverse-Proxy (nginx/Traefik/Cloudflare-Tunnel)
#   ausgeliefert, nicht direkt aus dem Container.
# - Vite-Frontend-Port (5173) entfällt komplett — `!reset []` über die
#   Default-Liste kippt das aus dem gemergten Compose-Dokument raus.
# - Neo4j-Host-Ports (7474/7687) werden im Prod-Override ebenfalls per
#   `!reset []` deaktiviert. Container-zu-Container-Bolt geht weiter
#   über das Compose-Netzwerk; wer Browser-Zugriff in Prod braucht,
#   tunnelt explizit (Tailscale, SSH-Forward).
# - Persistente Cache-Mounts (HuggingFace) bleiben.
#
# `!reset []` braucht Docker Compose v2.24+. Ältere Compose-Versionen
# fallen back auf array-merge — dann erbt Prod die Loopback-Ports vom
# Default. Das ist nicht ideal, aber kein Sicherheitsbruch (127.0.0.1).

services:
  agora:
    build:
      context: .
      target: prod
      args:
        # Gate: VITE_AGORA_TOKEN wird nur ins Bundle einkompiliert, wenn
        # ALLOW_BUILD_TIME_TOKEN=true gesetzt ist. Default: false →
        # Frontend bekommt leeren Token, Runtime-Login erforderlich.
        # Opt-In nur für Single-User-Tailnet-Deploys.
        # Siehe Dockerfile:ARG ALLOW_BUILD_TIME_TOKEN und
        # docs/security.md → F2.1
        ALLOW_BUILD_TIME_TOKEN: ${ALLOW_BUILD_TIME_TOKEN:-false}
        # Der eigentliche Token-Wert (wird nur bei Gate=true verwendet).
        VITE_AGORA_TOKEN: ${VITE_AGORA_TOKEN:-}
    ports: !override
      # Backend bleibt auf Loopback gebunden — externer Zugriff geht
      # über Reverse-Proxy / Tailscale / SSH-Forward, nicht direkt.
      - "127.0.0.1:${AGORA_BACKEND_PORT:-5001}:5001"
    read_only: true
    tmpfs: !override
      - /tmp:size=128M,mode=1777
      - /app/backend/logs:size=64M,mode=0700,uid=1000,gid=1000
      - /home/agora/.cache:size=256M,mode=0700,uid=1000,gid=1000
      - /home/agora/.gunicorn:size=1M,mode=0700,uid=1000,gid=1000
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # Default-Setup: Ollama läuft auf dem Host (siehe README.md sowie
      # docs/deployment-prod.md → "Ollama"). Container erreicht den
      # Host über `host.docker.internal`, das im Default-Compose per
      # `extra_hosts: host-gateway` aufgelöst wird (Linux-Bridge).
      #
      # Variante B (Ollama als Sibling-Container): per separatem
      # `compose.ollama.local.yml` als 3. -f-Datei einhängen und URLs
      # dort auf `http://ollama:11434` umbiegen — bewusst NICHT im
      # Repo-Default, weil sonst der Standardpfad bricht.
      # `.env`-Werte ueberschreiben den Default — fuer Cloud-Provider
      # (OpenAI, Together, vLLM) `EMBEDDING_BASE_URL` / `LLM_BASE_URL` in
      # der `.env` setzen. Falls Ollama auf dem Host genutzt wird, die
      # Variablen in der `.env` leer lassen oder auskommentieren, damit
      # der Default (`host.docker.internal`) greift — `localhost` aus der
      # `.env` wuerde im Container den Container selbst meinen und die
      # Verbindung kaputt machen.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}

  neo4j:
    ports: !reset []
