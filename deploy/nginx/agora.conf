# Agora nginx-Konfiguration — Server-Block für den Sidecar-Proxy.
# Eingebunden per `include /etc/nginx/conf.d/*.conf;` im nginx:alpine-Default-Image.
# Verwendung: deploy/compose/docker-compose.prod-with-proxy.yml
# Sub-Slice 45 (F1.1, M9 #2) — Closes #106.

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # Upstream-Auflösung zur Laufzeit statt beim Config-Load.
    #
    # Steht in `proxy_pass` ein literaler Hostname (`http://agora:5001`), löst
    # nginx ihn genau einmal beim Start auf und cacht die IP für die gesamte
    # Prozesslebensdauer. Wird der Backend-Container danach neu erzeugt, bekommt
    # er per Docker-DHCP eine andere IP — nginx proxyt weiter auf die alte.
    # Genau das ist am 13.08.2026 passiert: `agora` wanderte von .3 auf .4, die
    # freigewordene .3 ging an `agora-redis`, und nginx lieferte für jeden
    # /api/-Request 502 („connect() failed (111: Connection refused)"), weil es
    # gegen den Redis-Port 5001 verband. Ein `nginx -s reload` heilte es nur bis
    # zum nächsten Container-Neubau.
    #
    # 127.0.0.11 ist der eingebettete DNS-Server von Docker. Zusammen mit einem
    # Variablen-`proxy_pass` löst nginx den Namen pro Request neu auf und
    # respektiert `valid=10s` als Cache-Obergrenze.
    #
    # Wichtig: `proxy_pass http://$var;` OHNE URI-Teil reicht die Original-URI
    # unverändert durch — Verhalten identisch zum literalen proxy_pass.
    # ---------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agora_upstream agora:5001;

    # Großzügiges Upload-Limit: Report/Graph-Dateien können >10 MB groß werden.
    client_max_body_size 50M;

    # gzip für statische Assets des Frontend-Bundles (JS, CSS, JSON).
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ---------------------------------------------------------------------------
    # Eigener Healthcheck-Endpoint — antwortet ohne Backend-Kontakt.
    # Wird vom Container-Healthcheck und verify-deploy.sh genutzt.
    # ---------------------------------------------------------------------------
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------
    # /health → Backend durchreichen, damit verify-deploy.sh den App-Health
    # weiterhin gegen einen einzigen Port prüfen kann.
    # ---------------------------------------------------------------------------
    location = /health {
        proxy_pass         http://$agora_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------------
    # SSE-Route: /api/simulation/<id>/stream braucht gepuffertes Streaming aus.
    # Dieser Block MUSS vor /api/ stehen — nginx wählt den längsten prefix-Match,
    # daher würde /api/ sonst immer gewinnen und Buffering wäre aktiv.
    # ---------------------------------------------------------------------------
    location /api/simulation/ {
        proxy_pass             http://$agora_upstream;
        proxy_http_version     1.1;

        # SSE-Pflicht: Buffering deaktivieren, damit Events sofort ankommen.
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;

        # nginx-internes Flag; verhindert, dass nginx selbst nachbuffert.
        proxy_set_header       X-Accel-Buffering  no;

        proxy_set_header       Host               $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
    }

    # ---------------------------------------------------------------------------
    # Alle anderen API-Routes: Standard-Timeouts, normales Buffering.
    # MiniMax-M3 ontology-Generation kann >60s dauern, deshalb Timeout erhöht
    # damit der nginx-Upstream nicht vor dem Backend abbricht.
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://$agora_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # Gehashte Build-Artefakte. Vite vergibt pro Build einen Content-Hash im
    # Dateinamen (index-CmgyLN3h.js); eine geänderte Datei bekommt einen neuen
    # Namen und wird nie unter dem alten angefragt. Deshalb ist unbegrenztes
    # Caching hier korrekt und `immutable` erspart auch die Revalidierung.
    #
    # Muss vor `location /` stehen — nginx nimmt bei Prefix-Matches den
    # längsten, und `/` würde sonst greifen.
    # ---------------------------------------------------------------------------
    location /assets/ {
        root       /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------------------------------------------------------------------
    # Statisches Frontend-Bundle (Vue 3, History-Mode).
    # try_files leitet unbekannte Pfade auf index.html um — Vue-Router übernimmt.
    # Mount-Point: /usr/share/nginx/html ← ./frontend/dist (Bind-Mount im Compose).
    #
    # index.html trägt KEINEN Content-Hash im Namen und ist die einzige Datei,
    # die auf die gehashten Assets verweist. Ohne expliziten Cache-Control-Header
    # cacht ein Browser sie heuristisch — üblich sind 10 % der Zeit seit
    # `Last-Modified`, bei einer eine Woche alten Datei also rund 17 Stunden.
    # Der Nutzer bekam dann nach einem Deploy weiter die alte HTML samt
    # Verweisen auf die alten Asset-Namen und sah den neuen Stand nicht.
    # `no-cache` verbietet nicht das Speichern, sondern erzwingt die
    # Revalidierung gegen den ETag — ein 304 bleibt also der Normalfall.
    # ---------------------------------------------------------------------------
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
