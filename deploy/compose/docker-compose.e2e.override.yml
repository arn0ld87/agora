# E2E-Override für M11.4 Playwright-Smokes.
#
# docker-compose.prod.yml setzt aus M11 Phase 3 (Issue: Container-Hardening)
# das Backend auf `read_only: true` mit nur 4 tmpfs-Schreibpfaden:
#   /tmp, /app/backend/logs, /home/agora/.cache, /home/agora/.gunicorn
#
# Für die Smokes braucht das Backend jedoch Schreibzugriff auf
# /app/backend/uploads (run_registry, simulations/), weil RunRegistry beim
# Boot `os.makedirs(REGISTRY_DIR, exist_ok=True)` aufruft. Das wurde
# in M11 Phase 3 nicht in tmpfs abgebildet, weil Prod nur read-only
# Smokes über curl macht und die Schreibpfade per Bind-Mount kommen.
#
# Lösung für M11.4: read_only=false NUR für den E2E-Stack. Dieses
# Override wird ausschließlich in scripts/e2e-up.sh geladen, nicht
# in docker-compose.prod.yml. Prod-Hardening bleibt unangetastet.
#
# Followup #8: Zusätzlich legt scripts/e2e-up.sh den Bind-Mount-Source
# `./backend/uploads/run_registry` mit UID 1000 (Container-User `agora`)
# an, weil sonst der Docker-Daemon das Verzeichnis als root anlegt und
# der Container-User nicht reinschreiben kann (CI-Failure 25595884785).
# Issue #989: eigene container_name-Werte fuer den E2E-Stack.
#
# docker-compose.yml und der Proxy-Override setzen feste Namen (`agora`,
# `agora-neo4j`, `agora-redis`, `agora-nginx`). Container-Namen sind
# Daemon-global und ignorieren den Compose-Projektnamen — ein E2E-Lauf neben
# einem laufenden Dev-Stack scheiterte deshalb mit
#   Conflict. The container name "/agora-neo4j" is already in use
# und schlimmer: wurde der Dev-Stack danach gestartet, adoptierte Compose den
# zurueckgebliebenen E2E-Container unter demselben Namen — samt dessen
# Neo4j-Speicherwerten. Bei knappem Docker-RAM endete das in einer
# Restart-Schleife ("Invalid memory configuration - exceeds physical memory"),
# obwohl die .env des Dev-Stacks korrekt war.
#
# Host-Ports kollidieren nicht: docker-compose.prod.yml resettet die
# Neo4j-Ports, der Proxy-Override die des Backends; nach aussen publiziert der
# E2E-Stack nur nginx auf AGORA_PROXY_PORT.
#
# Die Service-Namen bleiben unveraendert — Compose-internes DNS und der
# nginx-Upstream (`agora:5001`) haengen am Service-Key, nicht am
# container_name.
services:
  redis:
    container_name: agora-e2e-redis

  nginx:
    container_name: agora-e2e-nginx

  # Prod-Defaults (docker-compose.yml: heap_max=2g, pagecache=4g, macher
  # zusammen ~6g Reservierung) lassen Neo4js Boot-Guard auf CI-Runnern
  # sporadisch mit "Invalid memory configuration - exceeds physical memory"
  # (Exit 3) abbrechen — der Check vergleicht die konfigurierte Summe gegen
  # das zum JVM-Start tatsächlich freie RAM, das auf geteilten Runnern
  # schwankt (reproduziert lokal via `docker run --memory=7g` bzw.
  # `--memory=9g` mit den Prod-Werten: dieselben Werte kippen inkonsistent
  # zwischen running/exit=3 je nach Limit). E2E-Fixtures sind klein,
  # 512m/512m reichen mit deutlichem Sicherheitsabstand.
  neo4j:
    container_name: agora-e2e-neo4j
    environment:
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=512m

  agora:
    container_name: agora-e2e
    read_only: false
    environment:
      # E2E-Stub-Modus: ersetzt alle LLM-Calls durch deterministische
      # Fixture-Antworten (llm_client.py:386). Nur gesetzt wenn der Runner
      # AGORA_E2E_LLM_MODE=stub exportiert hat — sonst leer, kein Effekt.
      # Notwendig, weil docker compose .env mit Vorrang vor Process-Env liest
      # und Job-Level-env ohne .env-Append den Container nicht erreicht.
      # e2e-up.sh schreibt den Wert zusätzlich in die .env (doppelte
      # Absicherung) — seit Issue #989 idempotent pro Schlüssel, und
      # e2e-down.sh entfernt ihn danach wieder.
      - AGORA_E2E_LLM_MODE=${AGORA_E2E_LLM_MODE:-}

  # Slice 5.6: Mock-Model-Server fuer die AiModelPicker-Discovery-Probe.
  #
  # Der agora-Container erreicht ihn im Compose-Default-Netzwerk (siehe
  # docker-compose.yml `networks: default:`) unter dem DNS-Namen
  # `mock-models`. Das ist absichtlich kein localhost/IP, weil
  # `_validate_public_base_url` (ai_provider_contract) lokale Adressen
  # ablehnt, DNS-Namen aber erlaubt. Der Mock liefert eine statische
  # OpenAI-kompatible /models-Antwort (`data[].id`), siehe
  # adapters._HttpModelsAdapter (protocol openai_compatible).
  mock-models:
    container_name: agora-e2e-mock-models
    image: nginx:alpine
    init: true
    volumes:
      # Pfade relativ zur Compose-Projekt-Wurzel (Repo-Root, dir der ersten
      # `-f`-Datei) — nicht zum Override-File. Siehe docker-compose.yml
      # `./backend/...`-Konvention.
      - ./deploy/e2e/mock-models/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/e2e/mock-models/models.json:/usr/share/nginx/html/models.json:ro
