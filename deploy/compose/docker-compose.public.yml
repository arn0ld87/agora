# Dedicated public demo instance. Apply after the production, nginx proxy,
# and Supabase overlays with `docker compose -p agora-demo` in a separate checkout.
# The personal instance keeps its Tailnet-only Traefik router and data mounts.
services:
  agora:
    container_name: agora-demo
    ports: !reset []
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 512
    environment:
      - AGORA_DEMO_MODE=true
      # Embeddings laufen fuer alle Besucher ueber den Betreiber-Endpoint
      # (gns3, llama.cpp qwen3-embedding:4b, 2560 Dim.). Werte und
      # EMBEDDING_API_KEY kommen aus der Demo-.env; die Freigabe greift nur
      # fuer exakt diese URL (AGORA_SHARED_EMBEDDING_BASE_URL).
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:?EMBEDDING_BASE_URL (gns3-Endpoint) fehlt}
      - AGORA_SHARED_EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:?EMBEDDING_BASE_URL (gns3-Endpoint) fehlt}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:?EMBEDDING_MODEL fehlt}
      - VECTOR_DIM=${VECTOR_DIM:?VECTOR_DIM fehlt}
      # Kein Betreiber-Fallback: leere Basis-URL/Modell lassen
      # StageModelRouter._provider_fallback_candidate None liefern, statt auf
      # das Host-Ollama (inkl. abgerechneter Cloud-Modelle) zu zeigen.
      - LLM_BASE_URL=
      - LLM_MODEL_NAME=
      - OPENAI_API_KEY=
      - GOOGLE_API_KEY=
      - GEMINI_API_KEY=
      - MINIMAX_API_KEY=
      - LLM_API_KEY=
      - ANTHROPIC_API_KEY=
      - OPENROUTER_API_KEY=
      - OLLAMA_API_KEY=
      - HF_TOKEN=
      - AGORA_LLM_TRIGGER_RATE_LIMIT_MAX=2
      - AGORA_LLM_TRIGGER_RATE_LIMIT_WINDOW_SECONDS=3600
      - AGORA_REPORT_RATE_LIMIT_MAX=2
      - AGORA_REPORT_RATE_LIMIT_WINDOW_SECONDS=3600
      - AGORA_UPLOAD_RATE_LIMIT_MAX=5
      - AGORA_UPLOAD_RATE_LIMIT_WINDOW_SECONDS=3600
    build:
      args:
        ALLOW_BUILD_TIME_TOKEN: "false"
        VITE_AGORA_TOKEN: ""

  redis:
    container_name: agora-demo-redis
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64

  neo4j:
    container_name: agora-demo-neo4j
    ports: !reset []
    cpus: 2.0
    mem_limit: 6g
    pids_limit: 256

  nginx:
    container_name: agora-demo-nginx
    ports: !reset []
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    build:
      args:
        ALLOW_BUILD_TIME_TOKEN: "false"
        VITE_AGORA_TOKEN: ""
    networks:
      default:
      proxy:
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.agora-demo.rule: "Host(`agora.alexle135.de`)"
      traefik.http.routers.agora-demo.entrypoints: websecure
      traefik.http.routers.agora-demo.tls.certresolver: letsencrypt
      traefik.http.routers.agora-demo.middlewares: security-headers@file
      traefik.http.services.agora-demo.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
