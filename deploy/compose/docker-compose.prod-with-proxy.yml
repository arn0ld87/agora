# Compose-Override: nginx-Sidecar als Reverse-Proxy.
# Verwendung: zusaetzlich zu docker-compose.yml + docker-compose.prod.yml laden.
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f deploy/compose/docker-compose.prod-with-proxy.yml \
#     up -d --build
#
# - Backend-Host-Ports werden komplett gestrichen (Sidecar erreicht agora
#   ueber das Compose-Netzwerk auf agora:5001, kein Loopback noetig).
# - nginx publisht :80 auf Host. Wer HTTPS will, terminiert das davor
#   (Tailscale-Funnel, Cloudflare-Tunnel, separater nginx auf Port 443).
# - frontend/dist muss VOR dem Stack-Start bereitstehen. Lokal per
#   `cd frontend && npm run build` bauen oder aus dem gebauten Prod-Image
#   extrahieren. Ohne Bundle zeigt nginx die Default-Welcome-Page.
# Closes #106.

services:
  agora:
    # Backend-Port wird nicht mehr auf den Host veroeffentlicht.
    # Der Sidecar erreicht agora ueber das Compose-interne Netzwerk (agora:5001).
    ports: !reset []
    environment:
      # Der Sidecar-nginx ist genau ein vertrauenswuerdiger Proxy vor Flask.
      # Nur in dieser Topologie darf Flask X-Forwarded-For/-Proto auswerten.
      - AGORA_PROXY_FIX_X_FOR=1
      - AGORA_PROXY_FIX_X_PROTO=1

  nginx:
    image: nginx:alpine
    container_name: agora-nginx
    restart: unless-stopped
    depends_on:
      - agora
    ports:
      - "${AGORA_PROXY_PORT:-80}:80"
    volumes:
      # nginx-Konfiguration (read-only)
      - ./deploy/nginx/agora.conf:/etc/nginx/conf.d/default.conf:ro
      # Statisches Frontend-Bundle — muss vorher gebaut oder aus dem Prod-Image extrahiert sein.
      # Pfade sind relativ zum Repo-Root (Aufruf-Verzeichnis bei `docker compose -f ...`).
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

# Default-Compose-Netzwerk wird automatisch von Compose erzeugt;
# nginx und agora teilen sich dieses Netz und koennen per Service-Name
# (`agora`, `nginx`) aufgeloest werden.
