# Compose-Override: nginx-Sidecar als Reverse-Proxy.
# Verwendung: zusaetzlich zu docker-compose.yml + docker-compose.prod.yml laden.
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f deploy/compose/docker-compose.prod-with-proxy.yml \
#     up -d --build
#
# - Backend-Host-Ports werden komplett gestrichen (Sidecar erreicht agora
#   ueber das Compose-Netzwerk auf agora:5001, kein Loopback noetig).
# - nginx baut aus dem Repo-Dockerfile (Stage "proxy") und enthaelt das
#   Frontend-Bundle bereits eingebacken (COPY --from=frontend-build). Kein
#   separater Host-Build, kein Bind-Mount fuer frontend/dist mehr noetig.
# - Default-Bind: 127.0.0.1:8080 -> Container-Port 80. Override per
#   AGORA_PROXY_BIND_HOST (z. B. 0.0.0.0 fuer bewusste Exposition hinter
#   einem TLS-/VPN-Profil) und AGORA_PROXY_PORT.
# - Wer HTTPS will, terminiert das davor (Tailscale-Funnel, Cloudflare-
#   Tunnel, separater nginx auf Port 443).
# Closes #106.

services:
  agora:
    # Backend-Port wird nicht mehr auf den Host veroeffentlicht.
    # Der Sidecar erreicht agora ueber das Compose-interne Netzwerk (agora:5001).
    ports: !reset []
    environment:
      # Der Sidecar-nginx ist genau ein vertrauenswuerdiger Proxy vor Flask.
      # Nur in dieser Topologie darf Flask X-Forwarded-For/-Proto auswerten.
      - AGORA_PROXY_FIX_X_FOR=1
      - AGORA_PROXY_FIX_X_PROTO=1

  nginx:
    build:
      # Docker Compose loest relative Pfade in Override-Dateien relativ zur
      # ERSTEN angegebenen Compose-Datei auf (hier docker-compose.yml im
      # Repo-Root), nicht relativ zum Verzeichnis dieser Datei. Deshalb "."
      # (= Repo-Root), analog zu docker-compose.yml/docker-compose.prod.yml.
      context: .
      target: proxy
    container_name: agora-nginx
    restart: unless-stopped
    depends_on:
      - agora
    ports:
      - "${AGORA_PROXY_BIND_HOST:-127.0.0.1}:${AGORA_PROXY_PORT:-8080}:80"
    healthcheck:
      # busybox-wget in nginx:alpine resolved `localhost` als IPv6 (::1),
      # `listen 80;` bindet aber nur IPv4 → ECONNREFUSED. 127.0.0.1 erzwingt IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

# Default-Compose-Netzwerk wird automatisch von Compose erzeugt;
# nginx und agora teilen sich dieses Netz und koennen per Service-Name
# (`agora`, `nginx`) aufgeloest werden.
